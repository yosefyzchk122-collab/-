<script>
const DATA={"he": {"dir": "rtl", "top": "ב״ה  •  יחי המלך המשיח!", "heroA": "זה", "heroB": "המשיח", "subtitle": "סימני מלך המשיח על פי הרמב״ם • הרבי מליובאוויטש • נביא הדור • חי וקיים • משיח ודאי • פסק הדין וקבלת המלכות", "nav": ["סימני הרמב״ם", "משיח ודאי", "חי וקיים", "נביא הדור", "פסק הדין", "קבלת המלכות", "כתיבה לרבי", "שאלות"], "rtitle": "סימני מלך המשיח על פי הרמב״ם", "rintro": "הרמב״ם בהלכות מלכים ומלחמותיהם, פרק י״א הלכה ד׳, נותן סימנים הלכתיים לזיהוי מלך המשיח עוד בזמן הגלות. בכל סימן מובאת הדרישה של הרמב״ם ואחריה כיצד היא מתקיימת ברבי מליובאוויטש.", "signs": [["01", "יעמוד מלך מבית דוד", "מלך מבית דוד", "מה דורש הרמב״ם?\nמלך המשיח הוא אדם ממשי, מנהיג ישראל, שמוצאו מבית דוד. בזמן הגלות עדיין אין סנהדרין שמעמידה מלך בכל דיני המלכות, ולכן בחומרי ההסבר מבואר שהמילה „מלך” בשלב זה מתארת הנהגה ממשית על עם ישראל והתחלת פעולות המשיח.\n\nכיצד מתקיים ברבי?\n• רבותינו נשיאינו העידו שהם מבית דוד, דרך המהר״ל מפראג המיוחס לדוד המלך.\n• הרבי עצמו העיד שאביו, הגאון המקובל רבי לוי יצחק שניאורסון, מיוחס לבית דוד.\n• הרבי הנהיג יהודים מכל החוגים ולא רק חסידי חב״ד: הוראות לכלל ישראל, מאבקים ציבוריים למען העם, דאגה לביטחון ישראל ושליחת אלפי שלוחים לכל העולם.\n• הרבי הפך את 770 למרכז הנהגה עולמי שממנו יוצאות הוראות תורה, חינוך, שליחות ועזרה ליהודים בכל מקום.\n\nמקורות: הקדמת „היום יום”; ספר השיחות תשמ״ט ח״ב עמ׳ 650; ליקוטי שיחות ח״י עמ׳ 276 ואילך; רמב״ם מלכים י״א, ד׳."], ["02", "הוגה בתורה", "הוגה בתורה", "מה דורש הרמב״ם?\nלא רק ידיעת תורה, אלא אדם שכל חייו חדורים בלימוד תורה ובפסיקת ההנהגה על פיה.\n\nכיצד מתקיים ברבי?\n• תורת הרבי משתרעת על נגלה ופנימיות התורה: תלמוד, רמב״ם, רש״י, הלכה, מדרש, קבלה וחסידות.\n• עשרות כרכים של ליקוטי שיחות, תורת מנחם, מאמרים ואגרות קודש משקפים רציפות עצומה של לימוד והוראה.\n• בהתוועדויות ב־770 הרבי היה דורש שעות ארוכות לפני אלפי תלמידי חכמים, רבנים וראשי ישיבות.\n• תקנת לימוד הרמב״ם היומי נועדה לאחד את כל ישראל בלימוד כל התורה שבעל פה כפי שסידרה הרמב״ם.\n• גם תשובות בנושאי רפואה, מדע וחיי היום־יום נבנו מתוך תורה והלכה.\n\nהסימן אינו „כמות ספרים”, אלא הנהגה שבה התורה היא המקור לכל החלטה."], ["03", "ועוסק במצוות כדוד אביו", "עוסק במצוות כדוד אביו", "מה דורש הרמב״ם?\nמלך המשיח צריך בעצמו לחיות תורה ומצוות בשלמות, „כדוד אביו”.\n\nכיצד מתקיים ברבי?\n• חייו האישיים של הרבי היו רצופים תפילה, לימוד, שמירת ההלכה וקיום מצוות בהידור.\n• מפעלו הציבורי כולו מכוון למעשה: תפילין, מזוזה, נרות שבת קודש, כשרות, טהרת המשפחה, צדקה, חינוך ולימוד תורה.\n• דוד המלך משלב מלכות וביטול לה׳. גם אצל הרבי התקיפות הציבורית באה יחד עם ענווה והדגשה שהמטרה היא רצון התורה ולא כוח אישי.\n• הרבי חזר שוב ושוב על העיקרון „המעשה הוא העיקר” — שתורה צריכה לרדת לפעולה ממשית."], ["04", "ויכוף כל ישראל לילך בה ולחזק בדקה", "מחזק את כל ישראל בתורה", "מה דורש הרמב״ם?\nהמילים „כל ישראל” הן מפתח: מלך המשיח פועל על כל יהודי, מכל חוג ורקע, כדי לחזק תורה ומצוות ולתקן פרצות בחיי היהדות.\n\nכיצד מתקיים ברבי?\n• מבצעי המצוות פונים לכל יהודי: תפילין, מזוזה, נרות שבת, כשרות, טהרת המשפחה, חינוך, תורה, אהבת ישראל וספרי קודש.\n• מפעל השליחות העולמי הקים בתי חב״ד, בתי כנסת, מקוואות, בתי ספר, גני ילדים, מערכות כשרות ושיעורי תורה באלפי מקומות.\n• הרבי פעל במיוחד למען יהודי ברית המועצות, יהודים במקומות מרוחקים ויהודים שלא היו קשורים קודם לחיי תורה.\n• לשון „יכוף” היא פעולה מתמשכת. בחסידות מוסבר שכפייה זו נעשית בדרכי נועם ואהבה, על ידי גילוי הנשמה והקשר הפנימי של כל יהודי לתורה.\n\nזהו אחד הסימנים הבולטים ביותר של „בחזקת שהוא משיח”."], ["05", "וילחם מלחמות ה׳", "מלחמות ה׳", "מה דורש הרמב״ם?\nמלך ישראל נלחם על קיום רצון ה׳, על שלמות העם ועל האפשרות לקיים תורה ומצוות.\n\nכיצד מתקיים ברבי?\n• מאבק נגד התבוללות ואיבוד הזהות היהודית.\n• מאבק למען יהודי ברית המועצות וזכותם ללמוד תורה, לקיים מצוות ולצאת לחירות.\n• עמידה תקיפה בנושא „מיהו יהודי” כדי לשמור על ההגדרה ההלכתית.\n• מאבק למען ביטחון ארץ ישראל ופיקוח נפש, והתרעה מפני מהלכים שמסכנים יהודים.\n• הפצת שבע מצוות בני נח והשפעה על אומות העולם להכיר בבורא ולחיות על פי מוסר אלוקי.\n\nהסימן נבחן כחלק מן המכלול כולו, לא בפני עצמו."]], "ctitle": "משיח ודאי — השלב השני ברמב״ם", "cintro": "לאחר סימני „בחזקת משיח” עובר הרמב״ם לתוצאות שהושגו בפועל: „אם עשה והצליח, וניצח כל האומות שסביביו, ובנה מקדש במקומו, וקיבץ נדחי ישראל — הרי זה משיח בוודאי, ויתקן את העולם כולו לעבוד את ה׳ ביחד”.", "certain": [["06", "אם עשה והצליח", "עשה והצליח", "בשלב הראשון הרמב״ם מתאר פעילות מתמשכת; כאן הוא דורש הצלחה בפועל. בי׳ שבט תשנ״ב הרבי מצטט את המעבר הזה: לאחר שישנו „מלך מבית דוד... בחזקת שהוא משיח”, צריך להגיע מיד ל„משיח בוודאי” באמצעות „עשה והצליח...”.\n\nהמסר: פעולות ההכנה אינן סוף התהליך; הן צריכות להביא את הגאולה עצמה."], ["07", "וניצח כל האומות שסביביו", "השפעה על אומות העולם", "בנוסח המלא של הרמב״ם מופיע ניצחון על האומות שסביביו. המטרה היא מצב שבו האומות אינן מונעות את הגאולה.\n\nבשבת פרשת משפטים תשנ״ב התייחס הרבי להחלטת המעצמות לצמצם נשק ולהפנות משאבים לצרכים מועילים, וקשר זאת לנבואת „וכתתו חרבותם לאתים”. הוא ראה בכך התחלה של שינוי עולמי המתאים לימי המשיח.\n\nכך הניצחון מקבל גם משמעות של שינוי הכיוון של העולם ממלחמה לשלום ועבודת ה׳."], ["08", "ובנה מקדש במקומו", "בנה מקדש „במקומו”", "בקונטרס „בית רבינו שבבבל” מבואר שבזמן הגלות השכינה שורה במיוחד בבית נשיא הדור, שהוא „שני לבית המקדש”. בגאולה עתיד בית המקדש להתגלות תחילה במקום זה ולאחר מכן לעבור לירושלים.\n\nבדורנו מקום נשיאותו של הרבי הוא 770 איסטערן פארקווי. הרבי מציין ש־770 בגימטרייה „בית משיח” וגם „פרצת”, ביטוי שחז״ל מקשרים למשיח.\n\nלכן מוסבר ש„בנה מקדש במקומו” מתחיל במקום מלך המשיח בזמן הגלות — בית רבינו שבבבל — כהכנה לגילוי בית המקדש השלישי.\n\nזה אינו מבטל את הפירוש הפשוט של בניין בית המקדש בירושלים; זהו ביאור כיצד התהליך מתחיל עוד במקום מלך המשיח בזמן הגלות.\n\nמקורות: קונטרס „בית רבינו שבבבל”; שיחות תנש״א–תשנ״ב; רמב״ם מלכים י״א, ד׳."], ["09", "וקיבץ נדחי ישראל", "קיבוץ גלויות", "קיבוץ נדחי ישראל הוא סימן מפורש של השלמת הגאולה.\n\nהרבי פעל במשך עשרות שנים למען יהודי ברית המועצות. כאשר נפתחו השערים ועלו המונים לארץ ישראל, הרבי ראה בכך שינוי היסטורי והכנה גלויה לקיבוץ הגלויות העתידי.\n\nהרבי דרש להכין לעולים דיור, תעסוקה, חינוך יהודי וקליטה רוחנית, כדי שהעלייה תהיה גם חיבור לארץ ישראל ולתורה.\n\nהשלמות של „וקיבץ נדחי ישראל” היא מן התוצאות שמגדירות „משיח בוודאי”."], ["10", "ויתקן את העולם כולו לעבוד את ה׳ ביחד", "תיקון העולם כולו", "תכלית הגאולה אינה רק פתרון לבעיות עם ישראל. הרמב״ם מתאר עולם שלם שמכיר בבורא.\n\nהרבי הפיץ את שבע מצוות בני נח והסביר שעם ישראל אחראי להשפיע גם על אומות העולם.\n\nבשיחות תנש״א–תשנ״ב הרבי הצביע על חירות דתית, ירידת המתח בין מעצמות ופירוק נשק כהכנה לעולם של „וכתתו חרבותם לאתים”.\n\nזהו היעד הסופי: „לקרוא כולם בשם ה׳ ולעבדו שכם אחד”."]], "lifeTitle": "חי וקיים — חיי מלך המשיח", "lifeIntro": "מקורות התורה והחסידות העומדים ביסוד ההסבר שחיי מלך המשיח קשורים לנצחיות, וכן מקורות לתהליך של גילוי, כיסוי והתגלות מחדש.", "life": [["תהילים כ״א, ה׳ — „חיים שאל ממך”", "חז״ל דורשים על מלך המשיח: „חיים שאל ממך נתתה לו, אורך ימים עולם ועד”. המילים „עולם ועד” הן יסוד מרכזי בנושא חיי משיח בן דוד."], ["סוכה נ״ב ע״א", "משיח בן דוד מבקש מן הקב״ה דבר אחד — חיים. הקב״ה משיב שכבר נתנבא עליו דוד: „חיים שאל ממך… אורך ימים עולם ועד”."], ["הרמב״ן — המוות בטל במשיח", "בויכוח הרמב״ן, סימן ל״ט, מבואר שלעתיד יתבטל עונש המוות שנגזר בעקבות חטא אדם הראשון; ובמשיח עצמו המוות „בטל לגמרי”."], ["„ובלע המוות לנצח”", "ישעיהו כ״ה, ח׳: „בלע המוות לנצח”. תפקיד המשיח להביא את העולם למצב שבו המוות מתבטל; בחסידות מוסבר שנשמת המשיח היא בחינת „יחידה” — עצם החיות."], ["חיות מבחינת אין־סוף", "בדרך מצותיך ובתורת חיים מבואר שחיי מלך המשיח נמשכים ממדרגה שלמעלה משינוי והפסק. לכן „דוד מלך ישראל חי וקיים” מקבל משמעות מיוחדת ביחס למשיח בן דוד."], ["דור הגאולה — נשמה בגוף", "בשיחות הרבי, ובפרט דבר מלכות בא תשנ״ב, מוסבר החידוש של דור הגאולה והקשר של נשיא הדור לפעולה בעולם הגשמי עד הגאולה."], ["גואל נגלה ונכסה", "במדרשים מופיע הדגם: „גואל ראשון נגלה ונכסה וחוזר ונגלה — אף גואל אחרון”. משה רבנו בישר על הגאולה, היה שלב של העלם, ולאחר מכן חזר להוציא את ישראל."], ["רש״י, רבנו בחיי והחתם סופר", "מקורות אלו מובאים להסביר אפשרות שמלך המשיח יתגלה, יתכסה לתקופה ואז יתגלה בשלמות. הכיסוי מתואר כניסיון אמונה קשה לפני הגילוי הסופי."], ["כי תשא תשנ״ב — „רק למראה עיניים”", "הרבי דיבר על אפשרות של „ירידה לפי שעה… ובחיצוניות, רק למראה עיניים”, שמטרתה להביא ל„עלייה נצחית שאין אחריה הפסק כלל”."], ["„ואני ידעתי גואלי חי”", "איוב י״ט, כ״ה: „ואני ידעתי גואלי חי”. הפסוק מבטא את הציפייה לגואל חי ולהתגלותו המלאה בעולם הגשמי."]], "prophetTitle": "נביא הדור", "prophet": "הרמב״ם בהלכות יסודי התורה פרקים ז׳–י׳ מגדיר נבואה ואת החובה לשמוע לנביא אמת. בשיחת שופטים תנש״א אמר הרבי שיש לפרסם לכל אנשי הדור שהקב״ה בחר ומינה אדם שיהיה „שופטייך”, „יועצייך” ו„נביא הדור”, שייתן הוראות ועצות בתורה, במצוות ובחיי היום־יום. הרבי ממשיך עד „הנבואה העיקרית” — „לאלתר לגאולה” ו„הנה זה משיח בא”.", "psakTitle": "פסק הדין של הרבנים", "psakText": "המסמך מוצג כאן בשלמותו. לחיצה על הדף פותחת תצוגה מוגדלת; ניתן גם לפתוח את קובץ ה־PDF המקורי.", "zoom": "לחץ להגדלה", "openPdf": "פתח PDF מקורי", "acceptTitle": "קבלת המלכות", "acceptText": "כבוד קדושת אדוננו מורנו ורבינו שליט״א מלך המשיח!\nהננו הח״מ מקבלים עלינו מלכותו של כ״ק אדמו״ר שליט״א מלך המשיח, לפעול במסירות נפש בכל רצונו ובכל מה שיידרש מאתנו, ומתוך שמחה וטוב לבב.\nיחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד!", "acceptExplain": "בתורה בחירת המלך היא מאת ה׳, אך המלכות מתגלה בפועל גם על ידי קבלת העם. דוד המלך נמשח על ידי שמואל הנביא, ולאחר מכן העם קיבל את מלכותו והכריז „יחי המלך”. קבלת המלכות אינה בחירת אדם חדש, אלא קבלת מלכותו של המלך שנבחר: התקשרות אליו, קבלת הוראותיו ובקשה שמלכותו תתגלה בפועל. לאחר שמכירים בסימני מלך המשיח, קבלת המלכות מבטאת החלטה להתחזק בתורה ובמצוות ולפעול להבאת הגאולה.", "fields": ["שם עברי מלא", "שם האם בעברית"], "consent": "אני מקבל/ת על עצמי את נוסח קבלת המלכות המופיע למעלה.", "add": "הוסף שם", "copy": "העתק שמות", "download": "הורד שמות", "clear": "מחק הכל", "saved": "שמות שנרשמו", "igrotTitle": "כתיבה לרבי — לבקש ברכה ועצה", "igrot": "אפשר לכתוב לרבי מכתב מסודר: לציין שם ושם האם, לתאר בקצרה את השאלה או הבקשה, לבקש ברכה ולקבל החלטה טובה בתורה ובמצוות. רבים משתמשים באגרות קודש כדי לבקש עצה, ברכה וחיזוק. אפשר לכתוב כעת דרך Igrot.com.", "igrotBtn": "כתבו לרבי עכשיו", "faqTitle": "שאלות ותשובות", "faq": [["האם המשיח חייב לעשות ניסים?", "לא. הרמב״ם מדגיש שאין צורך שמלך המשיח יעשה אותות ומופתים כדי להוכיח את זהותו."], ["למה יש שני שלבים?", "כדי לזהות את מנהיג הגאולה עוד לפני שהגאולה הושלמה. לאחר ההצלחה, בניין המקדש וקיבוץ נדחי ישראל, מגיעים ל„משיח בוודאי”."], ["מה פירוש „במקומו”?", "בקונטרס „בית רבינו שבבבל” מבואר הקשר המיוחד בין בית נשיא הדור בזמן הגלות לבין בית המקדש; בדורנו מודגש 770 כ„בית משיח” וכהכנה לבית המקדש השלישי."], ["למה קבלת המלכות חשובה?", "המלך נבחר מאת ה׳, אך המלכות מקבלת ביטוי מעשי גם בקבלת העם — התקשרות, ציות ובקשת גילוי המלכות בפועל."]], "contactTitle": "בית חב״ד לעולים — חיפה", "phone": "077-701-0356", "address": "הרצל 56, חיפה", "footer": "יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד!"}, "ru": {"dir": "ltr", "top": "ב״ה  •  ДА ЗДРАВСТВУЕТ КОРОЛЬ МОШИАХ!", "heroA": "ЭТО", "heroB": "МОШИАХ", "subtitle": "Признаки Короля Мошиаха по Рамбаму • Любавичский Ребе • пророк поколения • жив и существует • Мошиах несомненно • постановление раввинов и принятие царской власти", "nav": ["Признаки Рамбама", "Мошиах несомненно", "Жив вечно", "Пророк", "Постановление", "Принятие царства", "Письмо Ребе", "Вопросы"], "rtitle": "ПРИЗНАКИ МОШИАХА ПО РАМБАМУ", "rintro": "Рамбам, Законы царей 11:4, даёт галахические критерии, по которым Короля Мошиаха можно распознать ещё во время изгнания. Каждый пункт объясняет сам критерий и то, как он применяется к Любавичскому Ребе.", "signs": [["01", "יעמוד מלך מבית דוד", "Царь из дома Давида", "Что требует Рамбам?\nМошиах — конкретный человек, лидер Израиля из дома Давида. Пока изгнание продолжается, ещё нет полного Сангедрина и всех институтов царской власти, поэтому «царь» здесь объясняется как фактический лидер Израиля, начинающий работу Мошиаха.\n\nКак это относится к Ребе?\n• Любавичские Ребе свидетельствовали о происхождении своей династии из дома Давида через Махараля из Праги.\n• Ребе указывал, что его отец, великий каббалист рав Леви-Ицхак Шнеерсон, происходил из дома Давида.\n• Руководство Ребе было обращено ко всему еврейскому народу: общественные кампании, безопасность Израиля, помощь евреям и тысячи посланников по всему миру.\n• 770 стал мировым центром его руководства, Торы и шлихут.\n\nИсточники: предисловие к «Ха-йом йом»; Сефер hа-Сихот 5749, т. 2, стр. 650; Ликутей Сихот, т. 18, стр. 276 и далее."], ["02", "הוגה בתורה", "Постоянно погружён в Тору", "Что требует Рамбам?\nНе просто знание, а жизнь, целиком наполненную Торой.\n\nКак это относится к Ребе?\n• Учение Ребе охватывает Талмуд, Рамбама, Раши, галаху, Мидраш, Каббалу и хасидизм.\n• Десятки томов бесед, маамаров и писем отражают постоянное изучение и преподавание.\n• На фарбренгенах в 770 Ребе часами говорил перед тысячами учеников, раввинов и глав ешив.\n• Ежедневный цикл Рамбама был установлен, чтобы объединить Израиль через изучение всей Устной Торы.\n• Даже вопросы медицины, науки и повседневной жизни рассматривались через Тору и галаху."], ["03", "ועוסק במצוות כדוד אביו", "Соблюдает заповеди как Давид", "Что требует Рамбам?\nМошиах сам должен жить Торой и заповедями «как Давид».\n\nКак это относится к Ребе?\n• Личная жизнь Ребе строилась на молитве, постоянном изучении, галахической точности и тщательном исполнении мицвот.\n• Его общественная программа была практической: тфилин, мезуза, свечи Шаббата, кашрут, семейная чистота, цдака, образование и Тора.\n• Как и у Давида, сильное руководство сочеталось с подчинением воле Всевышнего.\n• Ребе постоянно подчёркивал: главное — практическое действие."], ["04", "ויכוף כל ישראל לילך בה ולחזק בדקה", "Побуждает весь Израиль следовать Торе", "Что требует Рамбам?\nКлючевые слова — «весь Израиль». Мошиах должен влиять на каждого еврея и укреплять ослабленные области еврейской жизни.\n\nКак это относится к Ребе?\n• Кампании тфилин, мезузы, шаббатних свечей, кашрута, семейной чистоты, образования и Торы обращены ко всем.\n• Всемирная система шлихут создала синагоги, миквы, школы, кошерную инфраструктуру и центры Торы в тысячах мест.\n• Ребе особенно действовал ради евреев СССР и евреев, далёких от традиционных общин.\n• Форма «будет побуждать» описывает продолжающийся процесс; хасидизм объясняет его как влияние любовью и раскрытием внутренней еврейской сущности.\n\nЭто один из самых заметных признаков стадии «в презумпции Мошиаха»."], ["05", "וילחם מלחמות ה׳", "Ведёт войны Всевышнего", "Что требует Рамбам?\nЦарь Израиля борется за народ Израиля, Тору и возможность жить согласно воле Всевышнего.\n\nКак это относится к Ребе?\n• Борьба против ассимиляции и потери еврейской идентичности.\n• Борьба за евреев Советского Союза.\n• Твёрдая позиция по галахическому вопросу «кто является евреем».\n• Кампания за безопасность Земли Израиля и сохранение еврейских жизней.\n• Распространение Семи заповедей Ноаха среди народов мира.\n\nЭтот пункт является частью общей совокупности признаков Рамбама."]], "ctitle": "МОШИАХ НЕСОМНЕННО — ВТОРАЯ СТАДИЯ", "cintro": "Далее Рамбам описывает достигнутые результаты: «если сделал и преуспел, победил все окружающие народы, построил Храм на своём месте и собрал рассеянных Израиля — это Мошиах несомненно».", "certain": [["06", "אם עשה והצליח", "Сделал и преуспел", "На первой стадии описывается продолжающаяся деятельность; здесь требуется фактический успех. В беседе 10 Швата 5752 Ребе цитирует переход от уже существующего «царя из дома Давида… в презумпции Мошиаха» к немедленному осуществлению стадии «Мошиах несомненно»."], ["07", "וניצח כל האומות שסביביו", "Влияние на народы мира", "В полном тексте Рамбама указана победа над окружающими народами. В Мишпатим 5752 Ребе связал решение сверхдержав сокращать вооружения и направлять средства на созидательные нужды с пророчеством «перекуют мечи на орала». Это отражает движение мира от конфронтации к миру."], ["08", "ובנה מקדש במקומו", "Построил Храм «на своём месте»", "В кунтресе «Бейт Рабейну ше-бе-Бавель» Ребе объясняет, что в изгнании Шхина особым образом пребывает в доме главы поколения — «втором после Храма». В эпоху Избавления Храм сначала раскрывается в этом месте, а затем переносится в Иерусалим.\n\nВ нашем поколении местом руководства Ребе является 770 Eastern Parkway. Ребе отмечал, что 770 имеет числовое значение «Бейт Мошиах» и «Парацта».\n\nПоэтому «построил Храм на своём месте» объясняется также как начало процесса в месте Короля Мошиаха ещё в изгнании — подготовка к раскрытию Третьего Храма. Это не отменяет буквального строительства Храма в Иерусалиме."], ["09", "וקיבץ נדחי ישראל", "Собрал рассеянных Израиля", "Собирание изгнанников — прямой итоговый критерий. Ребе десятилетиями действовал ради освобождения евреев СССР; открытие границ и массовую алию он рассматривал как историческую подготовку к будущему собиранию изгнанников. Он требовал готовить жильё, работу, образование и духовную абсорбцию для прибывающих евреев."], ["10", "ויתקן את העולם כולו לעבוד את ה׳ ביחד", "Исправит весь мир", "Ребе широко распространял Семь заповедей Ноаха и ответственность Израиля влиять на мир. В 5751–5752 он указывал на свободу религии, ослабление конфронтации и разоружение как подготовку к миру, в котором человечество признаёт Творца."]], "lifeTitle": "ЖИВ И СУЩЕСТВУЕТ — ЖИЗНЬ КОРОЛЯ МОШИАХА", "lifeIntro": "Источники Торы и хасидизма о вечной жизни Короля Мошиаха и о модели раскрытия, сокрытия и нового раскрытия.", "life": [["Псалмы 21:5 — «Жизнь просил у Тебя»", "Мудрецы относят к Королю Мошиаху стих: «Жизнь просил у Тебя — Ты дал ему; долготу дней во веки веков»."], ["Сукка 52а", "Мошиах бен Давид просит у Всевышнего только жизнь. Ответ связан со словами «долготу дней во веки веков»."], ["Рамбан — смерть отменена в самом Мошиахе", "В Диспуте Рамбана, §39, объясняется, что в эпоху Мошиаха наказание смерти отменяется; «но в самом Мошиахе она отменена полностью»."], ["«Поглотит смерть навеки»", "Ишаягу 25:8. Задача Мошиаха — привести мир к отмене смерти; хасидизм связывает его душу с уровнем йехида — сущностью жизни."], ["Жизнь из Бесконечности", "«Дерех Мицвотеха» и «Торат Хаим» объясняют жизнь Мошиаха как связанную с уровнем выше изменения и прекращения."], ["Поколение Избавления — душа в теле", "Поздние беседы Ребе, особенно Двар Малхут Бо 5752, объясняют особую роль поколения Избавления и главы поколения в физическом мире."], ["Избавитель раскрывается и скрывается", "Мидраши дают модель: первый избавитель раскрылся, скрылся и снова раскрылся — и так же последний избавитель."], ["Раши, Рабейну Бахья и Хатам Софер", "Эти источники приводятся для возможности временного сокрытия Мошиаха перед полным раскрытием."], ["Ки Тиса 5752 — «только для глаз»", "Ребе говорит о временном спуске «внешне, только для глаз», ведущем к вечному подъёму без последующего прекращения."], ["«Я знаю: мой Искупитель жив»", "Иов 19:25 выражает ожидание живого Искупителя и его полного раскрытия в физическом мире."]], "prophetTitle": "ПРОРОК ПОКОЛЕНИЯ", "prophet": "Рамбам в Законах основ Торы, главы 7–10, определяет пророчество и обязанность слушать истинного пророка. В беседе Шофтим 5751 Ребе говорит, что необходимо сообщить поколению о человеке, которого Всевышний назначил как «судью», «советника» и «пророка поколения». Главная пророческая весть формулируется как «немедленно к Избавлению» и «Вот Мошиах приходит».", "psakTitle": "ПОСТАНОВЛЕНИЕ РАВВИНОВ", "psakText": "Документ показан полностью. Нажмите на страницу, чтобы увеличить; также можно открыть оригинальный PDF.", "zoom": "Нажмите для увеличения", "openPdf": "Открыть оригинальный PDF", "acceptTitle": "ПРИНЯТИЕ ЦАРСКОЙ ВЛАСТИ", "acceptText": "Его Святейшеству, нашему господину, учителю и Ребе, Королю Мошиаху!\nМы, нижеподписавшиеся, принимаем на себя царскую власть Ребе, Короля Мошиаха, обязуясь с самоотверженностью исполнять его волю и всё, что от нас потребуется, с радостью и добрым сердцем.\nДа здравствует наш господин, учитель и Ребе, Король Мошиах, во веки веков!", "acceptExplain": "Согласно Торе, царь избирается Всевышним, но его царская власть проявляется также через принятие народом. Давид был помазан пророком Шмуэлем, а затем народ принял его царство и провозгласил: «Да здравствует царь». Принятие царской власти — не выбор нового кандидата, а признание уже определённого царя, готовность следовать его указаниям и просьба о полном раскрытии его царства. После узнавания признаков Мошиаха это выражает решение укреплять Тору и заповеди и действовать ради Избавления.", "fields": ["Полное еврейское имя", "Еврейское имя матери"], "consent": "Я принимаю на себя текст принятия царской власти, приведённый выше.", "add": "Добавить имя", "copy": "Скопировать имена", "download": "Скачать имена", "clear": "Очистить", "saved": "Записанные имена", "igrotTitle": "НАПИСАТЬ РЕБЕ — ПОПРОСИТЬ СОВЕТ И БЛАГОСЛОВЕНИЕ", "igrot": "Можно написать Ребе ясное письмо: указать имя и имя матери, кратко описать вопрос или просьбу, попросить благословение и принять хорошее решение в Торе и заповедях. Многие используют «Игрот Кодеш» для совета, благословения и укрепления. Написать письмо можно сейчас через Igrot.com.", "igrotBtn": "Написать Ребе сейчас", "faqTitle": "ВОПРОСЫ И ОТВЕТЫ", "faq": [["Должен ли Мошиах совершать чудеса?", "Нет. Рамбам подчёркивает, что чудеса не являются обязательным доказательством личности Мошиаха."], ["Зачем две стадии?", "Чтобы распознать руководителя Избавления до полного завершения процесса. После успеха, Храма и собирания изгнанников наступает стадия «Мошиах несомненно»."], ["Что означает «на своём месте»?", "«Бейт Рабейну ше-бе-Бавель» объясняет особую связь дома главы поколения в изгнании с Храмом; 770 подчёркивается как «Бейт Мошиах» и подготовка к Третьему Храму."], ["Почему важно принятие царской власти?", "Царь избирается Всевышним, но царство получает практическое выражение также через принятие народом — связь, послушание и просьбу о полном раскрытии царства."]], "contactTitle": "БЕЙТ ХАБАД ДЛЯ РЕПАТРИАНТОВ — ХАЙФА", "phone": "077-701-0356", "address": "ул. Герцль 56, Хайфа", "footer": "Да здравствует наш господин, учитель и Ребе — Король Мошиах — во веки веков!"}, "en": {"dir": "ltr", "top": "ב״ה  •  LONG LIVE KING MOSHIACH!", "heroA": "THIS IS", "heroB": "MOSHIACH", "subtitle": "Maimonides’ criteria • the Lubavitcher Rebbe • prophet of the generation • alive and enduring • certain Moshiach • rabbinic ruling and acceptance of kingship", "nav": ["Rambam’s criteria", "Certain Moshiach", "Eternal life", "Prophet", "Ruling", "Kingship", "Write to the Rebbe", "Questions"], "rtitle": "MAIMONIDES’ CRITERIA FOR MOSHIACH", "rintro": "Maimonides, Laws of Kings 11:4, gives halachic criteria by which King Moshiach can be recognized while exile still exists. Each item explains the criterion and its application to the Lubavitcher Rebbe.", "signs": [["01", "יעמוד מלך מבית דוד", "A king from the House of David", "Chabad sources cite the dynasty’s Davidic tradition through the Maharal of Prague and the Rebbe’s statement that his father, Rabbi Levi Yitzchak Schneerson, was of Davidic descent. The Rebbe’s worldwide Jewish leadership and emissary network are presented as the leadership component."], ["02", "הוגה בתורה", "Immersed in Torah", "The Rebbe’s teachings span Talmud, Rambam, Rashi, halachah, Midrash, Kabbalah and Chassidut. His long farbrengens and the daily Rambam cycle express constant Torah occupation and Torah-based leadership."], ["03", "ועוסק במצוות כדוד אביו", "Observes mitzvot like David", "The criterion requires personal Torah observance. The Rebbe’s halachic life, prayer, learning and practical mitzvah campaigns are presented as its application."], ["04", "ויכוף כל ישראל לילך בה ולחזק בדקה", "Moves all Israel toward Torah", "The words “all Israel” are essential. The worldwide shlichut system and campaigns for tefillin, mezuzah, Shabbat candles, kashrut, family purity, education and Torah reached Jews of every background."], ["05", "וילחם מלחמות ה׳", "Fights the wars of God", "Applied to the Rebbe through Soviet Jewry, Jewish identity, education, Israel’s security, opposition to assimilation and influence on the nations through the Noahide laws."]], "ctitle": "MOSHIACH WITH CERTAINTY — THE SECOND STAGE", "cintro": "Maimonides then describes achieved results: success, victory over surrounding nations, building the Temple in its place, gathering the dispersed of Israel and correcting the world to serve God together.", "certain": [["06", "אם עשה והצליח", "Acted and succeeded", "The language changes from ongoing activity to actual success. In 10 Shevat 5752 the Rebbe explicitly quotes the transition from presumed Moshiach to the next stage."], ["07", "וניצח כל האומות שסביביו", "Influence on the nations", "In Mishpatim 5752 the Rebbe connected superpower disarmament and constructive use of resources with “they shall beat their swords into plowshares.”"], ["08", "ובנה מקדש במקומו", "Built the Temple “in its place”", "In “Beit Rabbeinu Shebebavel,” the Rebbe explains the special role of the house of the leader of the generation in exile. In this generation, 770 is highlighted as “Beit Moshiach,” a preparation for the revelation of the Third Temple and its transfer to Jerusalem."], ["09", "וקיבץ נדחי ישראל", "Gathered the dispersed of Israel", "The Rebbe’s work for Soviet Jewry and his focus on aliyah and absorption are presented as preparation for the full ingathering, an explicit final criterion."], ["10", "ויתקן את העולם כולו לעבוד את ה׳ ביחד", "Corrected the whole world", "The Rebbe promoted the Seven Noahide Laws and identified global trends toward peace, religious freedom and disarmament as preparation for a world recognizing the Creator."]], "lifeTitle": "ALIVE AND ENDURING — THE LIFE OF KING MOSHIACH", "lifeIntro": "Torah and Chassidic sources used to explain the distinctive, eternal life of King Moshiach and the pattern of revelation, concealment and renewed revelation.", "life": [["Psalms 21:5", "“He asked life of You; You gave it to him, length of days forever and ever” is applied to King Moshiach."], ["Sukkah 52a", "Moshiach ben David asks God for life and is answered through the verse “length of days forever and ever.”"], ["Nachmanides", "In the Disputation, §39, Nachmanides states that death is ultimately annulled and “in Moshiach himself it is annulled completely.”"], ["“He will swallow death forever”", "Isaiah 25:8 expresses the final abolition of death; Chassidut links Moshiach’s soul with yechidah, the essence of life."], ["Life rooted in the Infinite", "Derech Mitzvotecha and Torat Chaim describe Moshiach’s life as rooted above ordinary change and interruption."], ["The generation of Redemption", "Late talks of the Rebbe, especially Dvar Malchut Bo 5752, discuss the role of the generation of Redemption and its leader in the physical world."], ["A redeemer revealed and concealed", "Midrash gives the pattern that the first redeemer was revealed, concealed and revealed again, and likewise the final redeemer."], ["Rashi, Rabbeinu Bachya and Chatam Sofer", "These are cited for a temporary concealment of Moshiach before complete revelation."], ["Ki Tisa 5752", "The Rebbe speaks of a temporary descent “externally, only to the eye,” leading to an eternal ascent without interruption."], ["“I know that my Redeemer lives”", "Job 19:25 expresses expectation of a living Redeemer and his full revelation in the physical world."]], "prophetTitle": "PROPHET OF THE GENERATION", "prophet": "Maimonides, Foundations of the Torah 7–10, defines prophecy and the duty to heed a true prophet. In Shoftim 5751 the Rebbe says the generation should be informed of the individual appointed as its judge, counselor and prophet, culminating in the message of immediate Redemption and “Behold, Moshiach is coming.”", "psakTitle": "THE RABBINIC RULING", "psakText": "The entire document is shown below. Tap the page to enlarge it, or open the original PDF.", "zoom": "Tap to enlarge", "openPdf": "Open original PDF", "acceptTitle": "ACCEPTANCE OF KINGSHIP", "acceptText": "To our holy master, teacher and Rebbe, King Moshiach!\nWe, the undersigned, accept upon ourselves the kingship of the Rebbe, King Moshiach, undertaking with self-sacrifice to fulfill his will and all that is required of us, with joy and a glad heart.\nLong live our master, teacher and Rebbe, King Moshiach, forever and ever!", "acceptExplain": "Torah teaches that the king is chosen by God, while kingship also becomes manifest through acceptance by the people. David was anointed by Samuel and the people later accepted his reign and proclaimed “Long live the king.” Acceptance of kingship is therefore not choosing a new candidate, but expressing allegiance to the recognized king, accepting his directives and asking for the full revelation of his kingship.", "fields": ["Full Hebrew name", "Mother’s Hebrew name"], "consent": "I accept the declaration of kingship above.", "add": "Add name", "copy": "Copy names", "download": "Download names", "clear": "Clear", "saved": "Recorded names", "igrotTitle": "WRITE TO THE REBBE — ASK FOR ADVICE AND BLESSING", "igrot": "Write a clear letter with your name and mother’s name, briefly describe the question or request, ask for a blessing and take a positive resolution in Torah and mitzvot. Many use Igrot Kodesh for guidance, blessing and encouragement. You can write now through Igrot.com.", "igrotBtn": "Write to the Rebbe now", "faqTitle": "QUESTIONS & ANSWERS", "faq": [["Must Moshiach perform miracles?", "No. Maimonides explicitly says miracles are not required to establish Moshiach."], ["Why two stages?", "The first makes identification possible before Redemption is complete; the second consists of achieved redemptive results."], ["What does “in its place” mean?", "Beit Rabbeinu Shebebavel explains the special connection between the leader’s house in exile and the Temple; 770 is emphasized as Beit Moshiach and preparation for the Third Temple."], ["Why accept kingship?", "The king is chosen by God, while public acceptance gives kingship practical expression through allegiance, obedience and the request for full revelation."]], "contactTitle": "BEIT CHABAD FOR OLIM — HAIFA", "phone": "077-701-0356", "address": "56 Herzl St., Haifa", "footer": "Long live our master, teacher and Rebbe — King Moshiach — forever and ever!"}};let lang=localStorage.getItem('moshiachLang')||'ru';let names=JSON.parse(localStorage.getItem('moshiachNames')||'[]');
function item(s){return `<details><summary><span class="num">${s[0]}</span><span>${s[2]}</span><span class="hebsrc">${s[1]}</span><span class="chev">⌄</span></summary><div class="body">${s[3]}</div></details>`}
function render(){const d=DATA[lang];document.documentElement.lang=lang;document.documentElement.dir=d.dir;document.body.dir=d.dir;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));topBrand.textContent=d.top;ha.textContent=d.heroA;hb.textContent=d.heroB;heroSub.textContent=d.subtitle;let ids=['rambam','certain','life','prophet','psak','accept','igrot','faq'];nav.innerHTML=d.nav.map((x,i)=>`<a href="#${ids[i]}">${x}</a>`).join('');rtitle.textContent=d.rtitle;rintro.textContent=d.rintro;signs.innerHTML=d.signs.map(item).join('');ctitle.textContent=d.ctitle;cintro.textContent=d.cintro;certainSigns.innerHTML=d.certain.map(item).join('');lifeTitle.textContent=d.lifeTitle;lifeIntro.textContent=d.lifeIntro;lifeGrid.innerHTML=d.life.map(x=>`<article class="source"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');prophetTitle.textContent=d.prophetTitle;prophetText.textContent=d.prophet;psakTitle.textContent=d.psakTitle;psakText.textContent=d.psakText;zoomBtn.textContent=d.zoom;openPdf.textContent=d.openPdf;acceptTitle.textContent=d.acceptTitle;acceptText.textContent=d.acceptText;acceptExplain.textContent=d.acceptExplain;f1.placeholder=d.fields[0];f2.placeholder=d.fields[1];consentText.textContent=d.consent;addBtn.textContent=d.add;copyBtn.textContent=d.copy;downloadBtn.textContent=d.download;clearBtn.textContent=d.clear;savedTitle.textContent=d.saved;igrotTitle.textContent=d.igrotTitle;igrotText.textContent=d.igrot;igrotBtn.textContent=d.igrotBtn;faqTitle.textContent=d.faqTitle;faqGrid.innerHTML=d.faq.map(q=>`<details><summary><span>${q[0]}</span><span class="chev">⌄</span></summary><div class="body">${q[1]}</div></details>`).join('');contactTitle.textContent=d.contactTitle;phone.textContent=d.phone;address.textContent=d.address;final.textContent=d.footer;renderNames()}
function renderNames(){savedList.innerHTML=names.length?names.map((n,i)=>`<div class="savedItem">${i+1}. ${n[0]} • ${n[1]}</div>`).join(''):'—'}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('moshiachLang',lang);render()});
function openZoom(){modal.classList.add('on');document.body.style.overflow='hidden'}zoomBtn.onclick=openZoom;psakImg.onclick=openZoom;closeModal.onclick=()=>{modal.classList.remove('on');document.body.style.overflow=''};modal.onclick=e=>{if(e.target===modal){modal.classList.remove('on');document.body.style.overflow=''}};
addBtn.onclick=()=>{if(!consent.checked){alert(lang==='he'?'יש לאשר את נוסח קבלת המלכות':lang==='ru'?'Подтвердите текст принятия царской власти':'Please confirm the declaration');return}let a=f1.value.trim(),b=f2.value.trim();if(!a||!b)return;names.push([a,b]);localStorage.setItem('moshiachNames',JSON.stringify(names));f1.value=f2.value='';consent.checked=false;renderNames()};
copyBtn.onclick=async()=>navigator.clipboard.writeText(names.map((n,i)=>`${i+1}. ${n[0]} | ${n[1]}`).join('\n'));downloadBtn.onclick=()=>{let csv='\uFEFF'+names.map(n=>n.map(v=>`"${v.replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='kabbalat-malchut.csv';a.click()};clearBtn.onclick=()=>{if(confirm(lang==='he'?'למחוק את כל השמות?':lang==='ru'?'Удалить все имена?':'Delete all names?')){names=[];localStorage.removeItem('moshiachNames');renderNames()}};render();
