const DATA={"he": {"dir": "rtl", "hero": "hero-he.png", "flag": "flag-he.png", "nav": ["סימני הרמב״ם", "משיח ודאי", "חי וקיים", "נביא הדור", "פסק הדין", "קבלת המלכות", "כתיבה לרבי", "שאלות"], "rtitle": "סימני מלך המשיח על פי הרמב״ם", "rintro": "הרמב״ם בהלכות מלכים ומלחמותיהם, פרק י״א הלכה ד׳, נותן סימנים הלכתיים לזיהוי מלך המשיח עוד בזמן הגלות. בכל סימן מובאת הדרישה של הרמב״ם ואחריה כיצד היא מתקיימת ברבי מליובאוויטש.", "signs": [["01", "יעמוד מלך מבית דוד", "מלך מבית דוד", "מה דורש הרמב״ם?\nמלך המשיח הוא אדם ממשי, מנהיג ישראל, שמוצאו מבית דוד. בזמן הגלות עדיין אין סנהדרין שמעמידה מלך בכל דיני המלכות, ולכן בחומרי ההסבר מבואר שהמילה „מלך” בשלב זה מתארת הנהגה ממשית על עם ישראל והתחלת פעולות המשיח.\n\nכיצד מתקיים ברבי?\n• רבותינו נשיאינו העידו שהם מבית דוד, דרך המהר״ל מפראג המיוחס לדוד המלך.\n• הרבי עצמו העיד שאביו, הגאון המקובל רבי לוי יצחק שניאורסון, מיוחס לבית דוד.\n• הרבי הנהיג יהודים מכל החוגים ולא רק חסידי חב״ד: הוראות לכלל ישראל, מאבקים ציבוריים למען העם, דאגה לביטחון ישראל ושליחת אלפי שלוחים לכל העולם.\n• הרבי הפך את 770 למרכז הנהגה עולמי שממנו יוצאות הוראות תורה, חינוך, שליחות ועזרה ליהודים בכל מקום.\n\nמקורות: הקדמת „היום יום”; ספר השיחות תשמ״ט ח״ב עמ׳ 650; ליקוטי שיחות ח״י עמ׳ 276 ואילך; רמב״ם מלכים י״א, ד׳."], ["02", "הוגה בתורה", "הוגה בתורה", "מה דורש הרמב״ם?\nלא רק ידיעת תורה, אלא אדם שכל חייו חדורים בלימוד תורה ובפסיקת ההנהגה על פיה.\n\nכיצד מתקיים ברבי?\n• תורת הרבי משתרעת על נגלה ופנימיות התורה: תלמוד, רמב״ם, רש״י, הלכה, מדרש, קבלה וחסידות.\n• עשרות כרכים של ליקוטי שיחות, תורת מנחם, מאמרים ואגרות קודש משקפים רציפות עצומה של לימוד והוראה.\n• בהתוועדויות ב־770 הרבי היה דורש שעות ארוכות לפני אלפי תלמידי חכמים, רבנים וראשי ישיבות.\n• תקנת לימוד הרמב״ם היומי נועדה לאחד את כל ישראל בלימוד כל התורה שבעל פה כפי שסידרה הרמב״ם.\n• גם תשובות בנושאי רפואה, מדע וחיי היום־יום נבנו מתוך תורה והלכה.\n\nהסימן אינו „כמות ספרים”, אלא הנהגה שבה התורה היא המקור לכל החלטה."], ["03", "ועוסק במצוות כדוד אביו", "עוסק במצוות כדוד אביו", "מה דורש הרמב״ם?\nמלך המשיח צריך בעצמו לחיות תורה ומצוות בשלמות, „כדוד אביו”.\n\nכיצד מתקיים ברבי?\n• חייו האישיים של הרבי היו רצופים תפילה, לימוד, שמירת ההלכה וקיום מצוות בהידור.\n• מפעלו הציבורי כולו מכוון למעשה: תפילין, מזוזה, נרות שבת קודש, כשרות, טהרת המשפחה, צדקה, חינוך ולימוד תורה.\n• דוד המלך משלב מלכות וביטול לה׳. גם אצל הרבי התקיפות הציבורית באה יחד עם ענווה והדגשה שהמטרה היא רצון התורה ולא כוח אישי.\n• הרבי חזר שוב ושוב על העיקרון „המעשה הוא העיקר” — שתורה צריכה לרדת לפעולה ממשית."], ["04", "ויכוף כל ישראל לילך בה ולחזק בדקה", "מחזק את כל ישראל בתורה", "מה דורש הרמב״ם?\nהמילים „כל ישראל” הן מפתח: מלך המשיח פועל על כל יהודי, מכל חוג ורקע, כדי לחזק תורה ומצוות ולתקן פרצות בחיי היהדות.\n\nכיצד מתקיים ברבי?\n• מבצעי המצוות פונים לכל יהודי: תפילין, מזוזה, נרות שבת, כשרות, טהרת המשפחה, חינוך, תורה, אהבת ישראל וספרי קודש.\n• מפעל השליחות העולמי הקים בתי חב״ד, בתי כנסת, מקוואות, בתי ספר, גני ילדים, מערכות כשרות ושיעורי תורה באלפי מקומות.\n• הרבי פעל במיוחד למען יהודי ברית המועצות, יהודים במקומות מרוחקים ויהודים שלא היו קשורים קודם לחיי תורה.\n• לשון „יכוף” היא פעולה מתמשכת. בחסידות מוסבר שכפייה זו נעשית בדרכי נועם ואהבה, על ידי גילוי הנשמה והקשר הפנימי של כל יהודי לתורה.\n\nזהו אחד הסימנים הבולטים ביותר של „בחזקת שהוא משיח”."], ["05", "וילחם מלחמות ה׳", "מלחמות ה׳", "מה דורש הרמב״ם?\nמלך ישראל נלחם על קיום רצון ה׳, על שלמות העם ועל האפשרות לקיים תורה ומצוות.\n\nכיצד מתקיים ברבי?\n• מאבק נגד התבוללות ואיבוד הזהות היהודית.\n• מאבק למען יהודי ברית המועצות וזכותם ללמוד תורה, לקיים מצוות ולצאת לחירות.\n• עמידה תקיפה בנושא „מיהו יהודי” כדי לשמור על ההגדרה ההלכתית.\n• מאבק למען ביטחון ארץ ישראל ופיקוח נפש, והתרעה מפני מהלכים שמסכנים יהודים.\n• הפצת שבע מצוות בני נח והשפעה על אומות העולם להכיר בבורא ולחיות על פי מוסר אלוקי.\n\nהסימן נבחן כחלק מן המכלול כולו, לא בפני עצמו."]], "ctitle": "משיח ודאי — השלב השני ברמב״ם", "cintro": "לאחר סימני „בחזקת משיח” עובר הרמב״ם לתוצאות שהושגו בפועל: „אם עשה והצליח, וניצח כל האומות שסביביו, ובנה מקדש במקומו, וקיבץ נדחי ישראל — הרי זה משיח בוודאי, ויתקן את העולם כולו לעבוד את ה׳ ביחד”.", "certain": [["06", "אם עשה והצליח", "עשה והצליח", "בשלב הראשון הרמב״ם מתאר פעילות מתמשכת; כאן הוא דורש הצלחה בפועל. בי׳ שבט תשנ״ב הרבי מצטט את המעבר הזה: לאחר שישנו „מלך מבית דוד... בחזקת שהוא משיח”, צריך להגיע מיד ל„משיח בוודאי” באמצעות „עשה והצליח...”.\n\nהמסר: פעולות ההכנה אינן סוף התהליך; הן צריכות להביא את הגאולה עצמה."], ["07", "וניצח כל האומות שסביביו", "השפעה על אומות העולם", "בנוסח המלא של הרמב״ם מופיע ניצחון על האומות שסביביו. המטרה היא מצב שבו האומות אינן מונעות את הגאולה.\n\nבשבת פרשת משפטים תשנ״ב התייחס הרבי להחלטת המעצמות לצמצם נשק ולהפנות משאבים לצרכים מועילים, וקשר זאת לנבואת „וכתתו חרבותם לאתים”. הוא ראה בכך התחלה של שינוי עולמי המתאים לימי המשיח.\n\nכך הניצחון מקבל גם משמעות של שינוי הכיוון של העולם ממלחמה לשלום ועבודת ה׳."], ["08", "ובנה מקדש במקומו", "בנה מקדש „במקומו”", "בקונטרס „בית רבינו שבבבל” מבואר שבזמן הגלות השכינה שורה במיוחד בבית נשיא הדור, שהוא „שני לבית המקדש”. בגאולה עתיד בית המקדש להתגלות תחילה במקום זה ולאחר מכן לעבור לירושלים.\n\nבדורנו מקום נשיאותו של הרבי הוא 770 איסטערן פארקווי. הרבי מציין ש־770 בגימטרייה „בית משיח” וגם „פרצת”, ביטוי שחז״ל מקשרים למשיח.\n\nלכן מוסבר ש„בנה מקדש במקומו” מתחיל במקום מלך המשיח בזמן הגלות — בית רבינו שבבבל — כהכנה לגילוי בית המקדש השלישי.\n\nזה אינו מבטל את הפירוש הפשוט של בניין בית המקדש בירושלים; זהו ביאור כיצד התהליך מתחיל עוד במקום מלך המשיח בזמן הגלות.\n\nמקורות: קונטרס „בית רבינו שבבבל”; שיחות תנש״א–תשנ״ב; רמב״ם מלכים י״א, ד׳."], ["09", "וקיבץ נדחי ישראל", "קיבוץ גלויות", "קיבוץ נדחי ישראל הוא סימן מפורש של השלמת הגאולה.\n\nהרבי פעל במשך עשרות שנים למען יהודי ברית המועצות. כאשר נפתחו השערים ועלו המונים לארץ ישראל, הרבי ראה בכך שינוי היסטורי והכנה גלויה לקיבוץ הגלויות העתידי.\n\nהרבי דרש להכין לעולים דיור, תעסוקה, חינוך יהודי וקליטה רוחנית, כדי שהעלייה תהיה גם חיבור לארץ ישראל ולתורה.\n\nהשלמות של „וקיבץ נדחי ישראל” היא מן התוצאות שמגדירות „משיח בוודאי”."], ["10", "ויתקן את העולם כולו לעבוד את ה׳ ביחד", "תיקון העולם כולו", "תכלית הגאולה אינה רק פתרון לבעיות עם ישראל. הרמב״ם מתאר עולם שלם שמכיר בבורא.\n\nהרבי הפיץ את שבע מצוות בני נח והסביר שעם ישראל אחראי להשפיע גם על אומות העולם.\n\nבשיחות תנש״א–תשנ״ב הרבי הצביע על חירות דתית, ירידת המתח בין מעצמות ופירוק נשק כהכנה לעולם של „וכתתו חרבותם לאתים”.\n\nזהו היעד הסופי: „לקרוא כולם בשם ה׳ ולעבדו שכם אחד”."]], "lifeTitle": "למה התורה קובעת יותר ממראה העיניים?", "lifeIntro": "הפרק הזה מרכז את ההסבר התורני המלא: מדוע ההכרעה נקבעת על פי התורה ולא רק לפי מה שנראה לעיניים, כיצד נשיא הדור ממשיך מדור לדור, מהו החידוש של דור הגאולה, ומה הקשר בין חיי מלך המשיח לנבואת הדור.", "life": [["„לא תסור” — גם כשהעיניים מראות אחרת", "התורה אומרת: „לא תסור מן הדבר אשר יגידו לך ימין ושמאל”. רש״י מפרש: אפילו אומר לך על ימין שהוא שמאל ועל שמאל שהוא ימין. המשמעות היא שסמכות התורה וחכמיה אינה מתבטלת רק מפני שהמראה החיצוני נראה אחרת. החושים שלנו מוגבלים; התורה היא אמת אלוקית ועל פיה נקבעת ההלכה."], ["שלוש דרגות באמונה", "מוסבר שיש שלושה מצבים: לפעמים המציאות הנראית מחזקת את האמונה; לפעמים היא ניטרלית ואינה סותרת אותה; והניסיון הגבוה ביותר הוא כאשר מה שנראה לעיניים נראה הפוך מדברי התורה. דווקא במצב כזה נדרשת נאמנות לדברי התורה והחכמים."], ["מראה העיניים אינו תמיד המציאות האמיתית", "בדברי הרבי מוסבר שעובדה שאדם אינו רואה דבר אינה מבטלת את קיומו. אדרבה: דבר שאדם רואה יכול להתברר כדמיון, ואילו כאשר התורה מעידה על מציאות מסוימת יש לעדות זו תוקף של אמת. לכן כאשר ברור שמראה העיניים הוא רק חיצוניות או אחיזת עיניים, ההלכה אינה משתנה בגלל המראה."], ["נשיא הדור חייב להיות בעולם בגוף", "נשיא הדור הוא „משה שבדור” והראש של כלל ישראל. כשם שהראש מחיה את כל אברי הגוף, כך נשיא הדור כולל את נשמות בני דורו ומשמש צינור לחיותם הרוחנית. משום כך בכל דור צריך להיות נשיא הדור בעולם הזה בגוף גשמי."], ["בדורות הקודמים — מעבר מנשיא לנשיא", "בדורות הקודמים, כאשר עבודתו של נשיא אחד הסתיימה אך העולם עדיין לא הגיע לגאולה, הייתה הסתלקות; נשמת משה שבנשיא התלבשה מיד בנשיא הדור הבא. כך נשמרה ההמשכיות ולא היה הפסק במציאות „משה שבדור”."], ["בדור הגאולה אין נשיא אחר אחריו", "הרבי קובע שדורנו הוא „הדור האחרון לגלות והראשון לגאולה”. משמעות הדברים היא שהדור אינו אמור להעביר את השליחות לדור נוסף. נשיא הדור הזה הוא זה שמוביל את הדור אל הגאולה, ולכן אין מקום למחליף אחר שימשיך אחריו את אותה שליחות."], ["דבר מלכות בא — „חיים נצחיים ללא הפסק בינתיים”", "על יסוד דבר מלכות בא תשנ״ב ושיחות נוספות מוסבר שהחידוש בדורנו הוא שאין אצל נשיא הדור אותו מעבר של הסתלקות הנשמה מן הגוף והתלבשותה בנשיא הבא שהיה בדורות קודמים. מציאות נשיא הדור נמשכת כנשמה בגוף באופן נצחי — „חיים נצחיים ללא הפסק בינתיים”."], ["עצם החיות של משיח", "בחסידות מוסבר שהחיות הרגילה היא התפשטות של חיות, ובה שייך שינוי והפסק. נשמת משיח קשורה לבחינת „יחידה” — עצם החיות. בעצם החיות לא שייך שינוי והפסק, ומכאן ההסבר לחיים הנצחיים של מלך המשיח."], ["תהילים וסוכה — „אורך ימים עולם ועד”", "בתהילים נאמר: „חיים שאל ממך נתתה לו, אורך ימים עולם ועד”. בגמרא סוכה נ״ב ע״א משיח בן דוד מבקש מן הקב״ה חיים, והקב״ה משיב שכבר נאמר עליו פסוק זה. המילים „עולם ועד” הן מקור מרכזי לנצחיות חיי משיח בן דוד."], ["הרמב״ן — במשיח עצמו המוות בטל", "בויכוח הרמב״ן, סימן ל״ט, מבואר שלעתיד יתבטל עונש המוות שנוצר בעקבות חטא אדם הראשון, ובמשיח עצמו המוות „בטל לגמרי”. מקור זה משמש יסוד לכך שהחידוש בנצחיות מתייחס למלך המשיח עצמו."], ["גואל נגלה ונכסה וחוזר ונגלה", "במדרשים מופיע הדגם: „גואל ראשון נגלה ונכסה וחוזר ונגלה — אף גואל אחרון”. משה רבנו בישר על הגאולה, היה שלב של העלם, ולאחר מכן חזר והוציא את ישראל. לכן תקופת כיסוי אינה בהכרח סוף השליחות, אלא יכולה להיות שלב לפני הגילוי המלא."], ["הקשר לנבואה", "כאשר נשיא הדור הוא גם נביא הדור, נוסף החיוב „אליו תשמעון”. לכן דבריו על דור הגאולה, על נצחיות נשיא הדור ועל ההכנה להתגלות המשיח מקבלים, בתוך המהלך התורני הזה, משמעות שאינה תלויה רק במה שהעין רואה."], ["תהילים כ״א, ה׳ — „חיים שאל ממך”", "חז״ל דורשים על מלך המשיח: „חיים שאל ממך נתתה לו, אורך ימים עולם ועד”. המילים „עולם ועד” הן יסוד מרכזי בנושא חיי משיח בן דוד."], ["סוכה נ״ב ע״א", "משיח בן דוד מבקש מן הקב״ה דבר אחד — חיים. הקב״ה משיב שכבר נתנבא עליו דוד: „חיים שאל ממך… אורך ימים עולם ועד”."], ["הרמב״ן — המוות בטל במשיח", "בויכוח הרמב״ן, סימן ל״ט, מבואר שלעתיד יתבטל עונש המוות שנגזר בעקבות חטא אדם הראשון; ובמשיח עצמו המוות „בטל לגמרי”."], ["„ובלע המוות לנצח”", "ישעיהו כ״ה, ח׳: „בלע המוות לנצח”. תפקיד המשיח להביא את העולם למצב שבו המוות מתבטל; בחסידות מוסבר שנשמת המשיח היא בחינת „יחידה” — עצם החיות."], ["חיות מבחינת אין־סוף", "בדרך מצותיך ובתורת חיים מבואר שחיי מלך המשיח נמשכים ממדרגה שלמעלה משינוי והפסק. לכן „דוד מלך ישראל חי וקיים” מקבל משמעות מיוחדת ביחס למשיח בן דוד."], ["דור הגאולה — נשמה בגוף", "בשיחות הרבי, ובפרט דבר מלכות בא תשנ״ב, מוסבר החידוש של דור הגאולה והקשר של נשיא הדור לפעולה בעולם הגשמי עד הגאולה."], ["גואל נגלה ונכסה", "במדרשים מופיע הדגם: „גואל ראשון נגלה ונכסה וחוזר ונגלה — אף גואל אחרון”. משה רבנו בישר על הגאולה, היה שלב של העלם, ולאחר מכן חזר להוציא את ישראל."], ["רש״י, רבנו בחיי והחתם סופר", "מקורות אלו מובאים להסביר אפשרות שמלך המשיח יתגלה, יתכסה לתקופה ואז יתגלה בשלמות. הכיסוי מתואר כניסיון אמונה קשה לפני הגילוי הסופי."], ["כי תשא תשנ״ב — „רק למראה עיניים”", "הרבי דיבר על אפשרות של „ירידה לפי שעה… ובחיצוניות, רק למראה עיניים”, שמטרתה להביא ל„עלייה נצחית שאין אחריה הפסק כלל”."], ["„ואני ידעתי גואלי חי”", "איוב י״ט, כ״ה: „ואני ידעתי גואלי חי”. הפסוק מבטא את הציפייה לגואל חי ולהתגלותו המלאה בעולם הגשמי."]], "prophetTitle": "נביא הדור — מהי נבואה ולמה חייבים לשמוע", "prophetIntro": "לפי הרמב״ם, הנבואה היא מיסודי הדת. התורה אינה מסתפקת בעצם קיומו של נביא, אלא מצווה אותנו: „אליו תשמעון”. בדור הגאולה מקבל נושא זה משמעות מעשית ומחייבת.", "prophet": [["נבואה היא יסוד בתורה", "הרמב״ם פותח את הלכות הנבואה בקביעה שמיסודי הדת לדעת שהקב״ה מנבא את בני האדם. הנבואה היא הדרך שבה רצון ה׳ מתגלה בתוך העולם באמצעות אדם בשר ודם. אין זו תופעה צדדית, אלא חלק ממבנה התורה והקשר בין הקב״ה לישראל."], ["„אליו תשמעון” — חיוב לשמוע לנביא", "בדברים י״ח, ט״ו נאמר על הנביא: „אליו תשמעון”. לאחר שאדם הוחזק כנביא אמת על פי כללי התורה, דבריו אינם עצה פרטית בלבד. כאשר הוא מוסר הוראה בתחום סמכותו ואינה סותרת את התורה, קיימת מצווה לשמוע לו. לכן להגדרת אדם כנביא יש משמעות הלכתית מעשית."], ["חזרת הנבואה כהקדמה למשיח", "באגרת תימן מביא הרמב״ם מסורת על חזרת הנבואה לישראל לפני הגאולה, וחזרת הנבואה מתוארת כהקדמה לביאת המשיח. בדורות החסידות מודגש גילוי רוח הקודש אצל נשיאי החסידות, ובמיוחד ככל שמתקרבים לגאולה."], ["נשיא הדור הוא „משה שבדור”", "הזוהר ומדרשי חז״ל מתארים התפשטות של נשמת משה בכל דור. נשיא הדור הוא הראש הרוחני של הדור, וכל נשמות הדור קשורות בו. כאשר נשיא הדור הוא גם נביא, הנהגתו מקבלת לא רק משמעות של הנהגה חסידית אלא גם משמעות הלכתית של דיני נבואה."], ["שיחת שופטים תנש״א", "בשיחת שופטים תנש״א אמר הרבי שיש לפרסם לכל אנשי הדור שזכינו שהקב״ה „בחר ומינה בעל בחירה” שיהיה „שופטייך”, „יועצייך” ו„נביא הדור”. הרבי מסביר שהוא נותן הוראות ועצות בעבודת כל בני ישראל, בענייני תורה ומצוות וגם בהנהגת חיי היום־יום — „בכל דרכיך דעהו” ו„כל מעשיך יהיו לשם שמים”."], ["הנבואה העיקרית של הדור", "אותה שיחה ממשיכה עד לנבואה המרכזית הנוגעת לכל אנשי הדור: „לאלתר לגאולה” ו„הנה זה משיח בא”. כלומר, קרבת הגאולה אינה מוצגת רק כתקווה, משאלה או ניתוח של המצב, אלא כנבואה שנמסרת לדור."], ["למה הדבר מחייב אותנו", "אם נשיא הדור הוא נביא הדור, התורה מצווה „אליו תשמעון”. לכן, לפי מהלך זה, דברי הרבי על הכנת העולם לגאולה והצורך להתכונן לקבלת פני משיח דורשים תגובה מעשית: להוסיף בתורה ובמצוות, להפיץ יהדות, ללמוד ענייני גאולה ומשיח ולפעול בהתאם להוראותיו."], ["נביא ומלך — שתי מערכות של חיוב", "המקורות מחברים בין נשיא הדור, נביא הדור ומלך המשיח. כל תואר מוסיף מערכת הלכתית משלו: לנביא — „אליו תשמעון”; למלך — כבוד המלך וקבלת הוראותיו כל עוד אינן סותרות את התורה; ולמלך המשיח — השליחות להביא את ישראל והעולם אל הגאולה."]], "psakTitle": "פסק הדין של הרבנים", "psakText": "המסמך מוצג כאן בשלמותו. לחיצה על הדף פותחת תצוגה מוגדלת; ניתן גם לפתוח את קובץ ה־PDF המקורי.", "zoom": "לחץ להגדלה", "openPdf": "פתח PDF מקורי", "acceptTitle": "קבלת המלכות", "acceptText": "כבוד קדושת אדוננו מורנו ורבינו שליט״א מלך המשיח!\nהננו הח״מ מקבלים עלינו מלכותו של כ״ק אדמו״ר שליט״א מלך המשיח, לפעול במסירות נפש בכל רצונו ובכל מה שיידרש מאתנו, ומתוך שמחה וטוב לבב.\nיחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד!", "acceptExplain": "בתורה בחירת המלך היא מאת ה׳, אך המלכות מתגלה בפועל גם על ידי קבלת העם. דוד המלך נמשח על ידי שמואל הנביא, ולאחר מכן העם קיבל את מלכותו והכריז „יחי המלך”. קבלת המלכות אינה בחירת אדם חדש, אלא קבלת מלכותו של המלך שנבחר: התקשרות אליו, קבלת הוראותיו ובקשה שמלכותו תתגלה בפועל. לאחר שמכירים בסימני מלך המשיח, קבלת המלכות מבטאת החלטה להתחזק בתורה ובמצוות ולפעול להבאת הגאולה.", "fields": ["שם עברי מלא", "שם האם בעברית"], "consent": "אני מקבל/ת על עצמי את נוסח קבלת המלכות המופיע למעלה.", "add": "הוסף שם", "copy": "העתק שמות", "download": "הורד שמות", "clear": "מחק הכל", "saved": "שמות שנרשמו", "igrotTitle": "כתיבה לרבי — לבקש ברכה ועצה", "igrot": "אפשר לכתוב לרבי מכתב מסודר: לציין שם ושם האם, לתאר בקצרה את השאלה או הבקשה, לבקש ברכה ולקבל החלטה טובה בתורה ובמצוות. רבים משתמשים באגרות קודש כדי לבקש עצה, ברכה וחיזוק. אפשר לכתוב כעת דרך Igrot.com.", "igrotBtn": "כתבו לרבי עכשיו", "faqTitle": "שאלות ותשובות", "faq": [["האם המשיח חייב לעשות ניסים?", "לא. הרמב״ם מדגיש שאין צורך שמלך המשיח יעשה אותות ומופתים כדי להוכיח את זהותו."], ["למה יש שני שלבים?", "כדי לזהות את מנהיג הגאולה עוד לפני שהגאולה הושלמה. לאחר ההצלחה, בניין המקדש וקיבוץ נדחי ישראל, מגיעים ל„משיח בוודאי”."], ["מה פירוש „במקומו”?", "בקונטרס „בית רבינו שבבבל” מבואר הקשר המיוחד בין בית נשיא הדור בזמן הגלות לבין בית המקדש; בדורנו מודגש 770 כ„בית משיח” וכהכנה לבית המקדש השלישי."], ["למה קבלת המלכות חשובה?", "המלך נבחר מאת ה׳, אך המלכות מקבלת ביטוי מעשי גם בקבלת העם — התקשרות, ציות ובקשת גילוי המלכות בפועל."]], "contactTitle": "לעולים ולדוברי רוסית בחיפה", "phone": "077-701-0356", "address": "הרצל 56, חיפה", "footer": "יחי אדוננו מורנו ורבינו מלך המשיח לעולם ועד!"}, "ru": {"dir": "ltr", "hero": "hero-ru.png", "flag": "flag-ru.png", "nav": ["Признаки Рамбама", "Мошиах несомненно", "Жив вечно", "Пророк", "Постановление", "Принятие царства", "Письмо Ребе", "Вопросы"], "rtitle": "ПРИЗНАКИ МОШИАХА ПО РАМБАМУ", "rintro": "Рамбам, Законы царей 11:4, даёт галахические критерии, по которым Короля Мошиаха можно распознать ещё во время изгнания. Каждый пункт объясняет сам критерий и то, как он применяется к Любавичскому Ребе.", "signs": [["01", "יעמוד מלך מבית דוד", "Царь из дома Давида", "Что требует Рамбам?\nМошиах — конкретный человек, лидер Израиля из дома Давида. Пока изгнание продолжается, ещё нет полного Сангедрина и всех институтов царской власти, поэтому «царь» здесь объясняется как фактический лидер Израиля, начинающий работу Мошиаха.\n\nКак это относится к Ребе?\n• Любавичские Ребе свидетельствовали о происхождении своей династии из дома Давида через Махараля из Праги.\n• Ребе указывал, что его отец, великий каббалист рав Леви-Ицхак Шнеерсон, происходил из дома Давида.\n• Руководство Ребе было обращено ко всему еврейскому народу: общественные кампании, безопасность Израиля, помощь евреям и тысячи посланников по всему миру.\n• 770 стал мировым центром его руководства, Торы и шлихут.\n\nИсточники: предисловие к «Ха-йом йом»; Сефер hа-Сихот 5749, т. 2, стр. 650; Ликутей Сихот, т. 18, стр. 276 и далее."], ["02", "הוגה בתורה", "Постоянно погружён в Тору", "Что требует Рамбам?\nНе просто знание, а жизнь, целиком наполненную Торой.\n\nКак это относится к Ребе?\n• Учение Ребе охватывает Талмуд, Рамбама, Раши, галаху, Мидраш, Каббалу и хасидизм.\n• Десятки томов бесед, маамаров и писем отражают постоянное изучение и преподавание.\n• На фарбренгенах в 770 Ребе часами говорил перед тысячами учеников, раввинов и глав ешив.\n• Ежедневный цикл Рамбама был установлен, чтобы объединить Израиль через изучение всей Устной Торы.\n• Даже вопросы медицины, науки и повседневной жизни рассматривались через Тору и галаху."], ["03", "ועוסק במצוות כדוד אביו", "Соблюдает заповеди как Давид", "Что требует Рамбам?\nМошиах сам должен жить Торой и заповедями «как Давид».\n\nКак это относится к Ребе?\n• Личная жизнь Ребе строилась на молитве, постоянном изучении, галахической точности и тщательном исполнении мицвот.\n• Его общественная программа была практической: тфилин, мезуза, свечи Шаббата, кашрут, семейная чистота, цдака, образование и Тора.\n• Как и у Давида, сильное руководство сочеталось с подчинением воле Всевышнего.\n• Ребе постоянно подчёркивал: главное — практическое действие."], ["04", "ויכוף כל ישראל לילך בה ולחזק בדקה", "Побуждает весь Израиль следовать Торе", "Что требует Рамбам?\nКлючевые слова — «весь Израиль». Мошиах должен влиять на каждого еврея и укреплять ослабленные области еврейской жизни.\n\nКак это относится к Ребе?\n• Кампании тфилин, мезузы, шаббатних свечей, кашрута, семейной чистоты, образования и Торы обращены ко всем.\n• Всемирная система шлихут создала синагоги, миквы, школы, кошерную инфраструктуру и центры Торы в тысячах мест.\n• Ребе особенно действовал ради евреев СССР и евреев, далёких от традиционных общин.\n• Форма «будет побуждать» описывает продолжающийся процесс; хасидизм объясняет его как влияние любовью и раскрытием внутренней еврейской сущности.\n\nЭто один из самых заметных признаков стадии «в презумпции Мошиаха»."], ["05", "וילחם מלחמות ה׳", "Ведёт войны Всевышнего", "Что требует Рамбам?\nЦарь Израиля борется за народ Израиля, Тору и возможность жить согласно воле Всевышнего.\n\nКак это относится к Ребе?\n• Борьба против ассимиляции и потери еврейской идентичности.\n• Борьба за евреев Советского Союза.\n• Твёрдая позиция по галахическому вопросу «кто является евреем».\n• Кампания за безопасность Земли Израиля и сохранение еврейских жизней.\n• Распространение Семи заповедей Ноаха среди народов мира.\n\nЭтот пункт является частью общей совокупности признаков Рамбама."]], "ctitle": "МОШИАХ НЕСОМНЕННО — ВТОРАЯ СТАДИЯ", "cintro": "Далее Рамбам описывает достигнутые результаты: «если сделал и преуспел, победил все окружающие народы, построил Храм на своём месте и собрал рассеянных Израиля — это Мошиах несомненно».", "certain": [["06", "אם עשה והצליח", "Сделал и преуспел", "На первой стадии описывается продолжающаяся деятельность; здесь требуется фактический успех. В беседе 10 Швата 5752 Ребе цитирует переход от уже существующего «царя из дома Давида… в презумпции Мошиаха» к немедленному осуществлению стадии «Мошиах несомненно»."], ["07", "וניצח כל האומות שסביביו", "Влияние на народы мира", "В полном тексте Рамбама указана победа над окружающими народами. В Мишпатим 5752 Ребе связал решение сверхдержав сокращать вооружения и направлять средства на созидательные нужды с пророчеством «перекуют мечи на орала». Это отражает движение мира от конфронтации к миру."], ["08", "ובנה מקדש במקומו", "Построил Храм «на своём месте»", "В кунтресе «Бейт Рабейну ше-бе-Бавель» Ребе объясняет, что в изгнании Шхина особым образом пребывает в доме главы поколения — «втором после Храма». В эпоху Избавления Храм сначала раскрывается в этом месте, а затем переносится в Иерусалим.\n\nВ нашем поколении местом руководства Ребе является 770 Eastern Parkway. Ребе отмечал, что 770 имеет числовое значение «Бейт Мошиах» и «Парацта».\n\nПоэтому «построил Храм на своём месте» объясняется также как начало процесса в месте Короля Мошиаха ещё в изгнании — подготовка к раскрытию Третьего Храма. Это не отменяет буквального строительства Храма в Иерусалиме."], ["09", "וקיבץ נדחי ישראל", "Собрал рассеянных Израиля", "Собирание изгнанников — прямой итоговый критерий. Ребе десятилетиями действовал ради освобождения евреев СССР; открытие границ и массовую алию он рассматривал как историческую подготовку к будущему собиранию изгнанников. Он требовал готовить жильё, работу, образование и духовную абсорбцию для прибывающих евреев."], ["10", "ויתקן את העולם כולו לעבוד את ה׳ ביחד", "Исправит весь мир", "Ребе широко распространял Семь заповедей Ноаха и ответственность Израиля влиять на мир. В 5751–5752 он указывал на свободу религии, ослабление конфронтации и разоружение как подготовку к миру, в котором человечество признаёт Творца."]], "lifeTitle": "ПОЧЕМУ ТОРА ОПРЕДЕЛЯЕТ РЕАЛЬНОСТЬ СИЛЬНЕЕ, ЧЕМ ВНЕШНЯЯ КАРТИНА?", "lifeIntro": "Этот раздел собирает полный ход аргументации: почему определяющей является Тора, а не только внешняя картина; как продолжается институт главы поколения; в чём новизна поколения Избавления; и как вечная жизнь Короля Мошиаха связана с пророчеством поколения.", "life": [["«Не уклоняйся» — даже если глаза показывают иначе", "Тора говорит: «не уклоняйся от того, что они скажут тебе, ни вправо, ни влево». Раши объясняет: даже если тебе говорят о правом, что оно левое, и о левом, что оно правое. Авторитет Торы и её мудрецов не отменяется только потому, что внешняя картина выглядит иначе."], ["Три уровня испытания веры", "Иногда видимое подтверждает веру; иногда оно ей не противоречит; а самое тяжёлое испытание — когда внешняя картина кажется противоположной словам Торы. Именно тогда требуется верность Торе и словам мудрецов."], ["То, что не видно, не перестаёт существовать", "В объяснениях Ребе подчёркивается: отсутствие видимости не отменяет существование. То, что человек видит, может оказаться иллюзией, тогда как свидетельство Торы имеет силу истины. Поэтому, если внешняя картина является лишь оболочкой, галахическая реальность не меняется из-за неё."], ["Глава поколения должен быть в физическом мире", "Глава поколения — «Моше поколения», духовная голова всего Израиля. Как голова даёт жизненность телу, так глава поколения включает души своего поколения и является каналом духовной жизненности. Поэтому в каждом поколении должен быть глава поколения в физическом мире."], ["В прежних поколениях — переход к следующему главе", "Когда работа одного главы поколения завершалась, но мир ещё не достиг Избавления, происходила исталкут, и душа Моше немедленно облекалась в следующего главу поколения. Так сохранялась непрерывность: не бывает поколения без «Моше поколения»."], ["В поколении Избавления нет следующего главы", "Ребе определяет наше поколение как «последнее поколение изгнания и первое поколение Избавления». Оно должно осуществить само Избавление, а не передать миссию следующему поколению. Поэтому нет места новому главе, который заменит главу поколения Избавления."], ["Двар Малхут Бо — «вечная жизнь без промежуточного перерыва»", "На основании Двар Малхут Бо 5752 и других бесед объясняется, что в нашем поколении не действует прежняя схема отделения души от тела и перехода к следующему главе. Существование главы поколения продолжается как душа в теле вечно — «вечная жизнь без промежуточного перерыва»."], ["Сущность жизненности Мошиаха", "Хасидизм объясняет: обычная жизненность является распространением жизненной силы, где возможны изменение и прекращение. Душа Мошиаха связана с уровнем йехида — самой сущностью жизни. В сущности жизни нет изменения и прекращения."], ["Псалмы и Сукка — «долготу дней во веки веков»", "В Псалмах сказано: «Жизнь просил у Тебя — Ты дал ему, долготу дней во веки веков». В Сукка 52а Мошиах бен Давид просит Всевышнего о жизни, и ответ связывается с этим стихом."], ["Рамбан — в самом Мошиахе смерть отменена", "В Диспуте Рамбана, §39, объясняется, что в будущем наказание смерти будет отменено, а «в самом Мошиахе она отменена полностью». Это один из центральных источников идеи вечной жизни самого Мошиаха."], ["Избавитель раскрывается, скрывается и снова раскрывается", "Мидраши дают модель: первый избавитель раскрылся, был скрыт и снова раскрылся — так же и последний избавитель. Поэтому период сокрытия не обязательно означает конец миссии, а может быть этапом перед полным раскрытием."], ["Связь с пророчеством", "Когда глава поколения является также пророком поколения, добавляется заповедь «его слушайте». Поэтому его слова о поколении Избавления, вечной жизни главы поколения и подготовке к раскрытию Мошиаха получают в этой системе значение, не зависящее только от внешнего зрения."], ["Псалмы 21:5 — «Жизнь просил у Тебя»", "Мудрецы относят к Королю Мошиаху стих: «Жизнь просил у Тебя — Ты дал ему; долготу дней во веки веков»."], ["Сукка 52а", "Мошиах бен Давид просит у Всевышнего только жизнь. Ответ связан со словами «долготу дней во веки веков»."], ["Рамбан — смерть отменена в самом Мошиахе", "В Диспуте Рамбана, §39, объясняется, что в эпоху Мошиаха наказание смерти отменяется; «но в самом Мошиахе она отменена полностью»."], ["«Поглотит смерть навеки»", "Ишаягу 25:8. Задача Мошиаха — привести мир к отмене смерти; хасидизм связывает его душу с уровнем йехида — сущностью жизни."], ["Жизнь из Бесконечности", "«Дерех Мицвотеха» и «Торат Хаим» объясняют жизнь Мошиаха как связанную с уровнем выше изменения и прекращения."], ["Поколение Избавления — душа в теле", "Поздние беседы Ребе, особенно Двар Малхут Бо 5752, объясняют особую роль поколения Избавления и главы поколения в физическом мире."], ["Избавитель раскрывается и скрывается", "Мидраши дают модель: первый избавитель раскрылся, скрылся и снова раскрылся — и так же последний избавитель."], ["Раши, Рабейну Бахья и Хатам Софер", "Эти источники приводятся для возможности временного сокрытия Мошиаха перед полным раскрытием."], ["Ки Тиса 5752 — «только для глаз»", "Ребе говорит о временном спуске «внешне, только для глаз», ведущем к вечному подъёму без последующего прекращения."], ["«Я знаю: мой Искупитель жив»", "Иов 19:25 выражает ожидание живого Искупителя и его полного раскрытия в физическом мире."]], "prophetTitle": "ПРОРОК ПОКОЛЕНИЯ — ЧТО ТАКОЕ ПРОРОЧЕСТВО И ПОЧЕМУ ЕГО НУЖНО СЛУШАТЬ", "prophetIntro": "По Рамбаму пророчество относится к основам религии. Тора не только признаёт существование пророка, но и повелевает: «его слушайте». В поколении Избавления эта тема приобретает практическое и обязательное значение.", "prophet": [["Пророчество — основа Торы", "Рамбам открывает законы пророчества утверждением, что к основам религии относится знание, что Всевышний наделяет людей пророчеством. Пророчество — способ раскрытия Божественной воли в физическом мире через человека."], ["«Его слушайте» — обязанность слушать пророка", "В Дварим 18:15 сказано о пророке: «его слушайте». После того как человек признан истинным пророком по правилам Торы, его слова не являются просто частным советом. Когда он даёт указание в рамках своих полномочий и оно не противоречит Торе, существует заповедь его слушать."], ["Возвращение пророчества перед Мошиахом", "В «Послании в Йемен» Рамбам приводит традицию о возвращении пророчества к Израилю перед Избавлением. Возвращение пророчества рассматривается как преддверие Мошиаха. В поколениях хасидизма подчёркивалось проявление руах hа-кодеш у лидеров хасидизма, особенно по мере приближения Избавления."], ["Глава поколения — «Моше поколения»", "Зоар и слова мудрецов говорят о распространении души Моше в каждом поколении. Глава поколения является духовной головой поколения. Когда он одновременно является пророком, его руководство имеет не только хасидское, но и галахическое измерение."], ["Беседа Шофтим 5751", "В Шофтим 5751 Ребе говорит, что необходимо сообщить всем людям поколения: мы удостоились того, что Всевышний «избрал и назначил человека», который будет «судьёй», «советником» и «пророком поколения». Он даёт указания и советы в Торе, заповедях и повседневной жизни."], ["Главное пророчество поколения", "Та же беседа приводит центральную пророческую весть: «немедленно к Избавлению» и «Вот Мошиах приходит». Близость Избавления представляется здесь не только как надежда или оценка, а как пророческое сообщение поколению."], ["Почему это требует действия", "Если глава поколения является пророком поколения, Тора повелевает «его слушайте». Поэтому слова о подготовке мира к Избавлению требуют практической реакции: увеличивать Тору и мицвот, распространять иудаизм, изучать темы Избавления и Мошиаха и действовать по указаниям главы поколения."], ["Пророк и царь — две системы обязанностей", "Источники соединяют роли главы поколения, пророка поколения и Короля Мошиаха. Каждая роль добавляет свой галахический аспект: пророка нужно слушать; царя — почитать и выполнять его законные распоряжения; задача Короля Мошиаха — привести Израиль и мир к Избавлению."]], "psakTitle": "ПОСТАНОВЛЕНИЕ РАВВИНОВ", "psakText": "Документ показан полностью. Нажмите на страницу, чтобы увеличить; также можно открыть оригинальный PDF.", "zoom": "Нажмите для увеличения", "openPdf": "Открыть оригинальный PDF", "acceptTitle": "ПРИНЯТИЕ ЦАРСКОЙ ВЛАСТИ", "acceptText": "Его Святейшеству, нашему господину, учителю и Ребе, Королю Мошиаху!\nМы, нижеподписавшиеся, принимаем на себя царскую власть Ребе, Короля Мошиаха, обязуясь с самоотверженностью исполнять его волю и всё, что от нас потребуется, с радостью и добрым сердцем.\nДа здравствует наш господин, учитель и Ребе, Король Мошиах, во веки веков!", "acceptExplain": "Согласно Торе, царь избирается Всевышним, но его царская власть проявляется также через принятие народом. Давид был помазан пророком Шмуэлем, а затем народ принял его царство и провозгласил: «Да здравствует царь». Принятие царской власти — не выбор нового кандидата, а признание уже определённого царя, готовность следовать его указаниям и просьба о полном раскрытии его царства. После узнавания признаков Мошиаха это выражает решение укреплять Тору и заповеди и действовать ради Избавления.", "fields": ["Полное еврейское имя", "Еврейское имя матери"], "consent": "Я принимаю на себя текст принятия царской власти, приведённый выше.", "add": "Добавить имя", "copy": "Скопировать имена", "download": "Скачать имена", "clear": "Очистить", "saved": "Записанные имена", "igrotTitle": "НАПИСАТЬ РЕБЕ — ПОПРОСИТЬ СОВЕТ И БЛАГОСЛОВЕНИЕ", "igrot": "Можно написать Ребе ясное письмо: указать имя и имя матери, кратко описать вопрос или просьбу, попросить благословение и принять хорошее решение в Торе и заповедях. Многие используют «Игрот Кодеш» для совета, благословения и укрепления. Написать письмо можно сейчас через Igrot.com.", "igrotBtn": "Написать Ребе сейчас", "faqTitle": "ВОПРОСЫ И ОТВЕТЫ", "faq": [["Должен ли Мошиах совершать чудеса?", "Нет. Рамбам подчёркивает, что чудеса не являются обязательным доказательством личности Мошиаха."], ["Зачем две стадии?", "Чтобы распознать руководителя Избавления до полного завершения процесса. После успеха, Храма и собирания изгнанников наступает стадия «Мошиах несомненно»."], ["Что означает «на своём месте»?", "«Бейт Рабейну ше-бе-Бавель» объясняет особую связь дома главы поколения в изгнании с Храмом; 770 подчёркивается как «Бейт Мошиах» и подготовка к Третьему Храму."], ["Почему важно принятие царской власти?", "Царь избирается Всевышним, но царство получает практическое выражение также через принятие народом — связь, послушание и просьбу о полном раскрытии царства."]], "contactTitle": "для репатриантов и русскоязычных — Хайфа", "phone": "077-701-0356", "address": "ул. Герцль 56, Хайфа", "footer": "Да здравствует наш господин, учитель и Ребе — Король Мошиах — во веки веков!"}};

DATA.he.whyTitle="חב״ד אומרים שהרבי מלך המשיח שיחי׳ לעולם ועד הוא מלך המשיח — למה?";
DATA.he.whyLeadTitle="לא סיסמה — שאלה הלכתית";
DATA.he.whyLead="הרמב״ם לא משאיר את זה בתחום של כריזמה, ניסים או ניחושים. הוא נותן מסלול: מי יכול להיות בחזקת משיח, ומה צריך לקרות כדי להגיע למשיח ודאי. כאן עוברים על המסלול הזה בשפה ברורה: מה הרמב״ם דורש, מה הרבי הסביר על כל שלב, ולמה חסידי חב״ד מזהים את הסימנים האלה ברבי.";
DATA.he.whyReader=[
["מה בכלל אמור משיח לעשות?","לפי הרמב״ם, התפקיד של משיח הוא להחזיר את מלכות בית דוד, להביא את עם ישראל לשלמות של תורה ומצוות, לבנות את המקדש, לקבץ את נדחי ישראל ולהביא את העולם להכרה בבורא. לכן הסימנים אינם פרטים אקראיים: כל אחד מהם בודק האם האדם הזה מתאים לתפקיד."],
["למה אפשר לזהות משיח עוד בגלות?","הרמב״ם מגדיר שלב של „בחזקת שהוא משיח”. זה בדיוק נועד כדי לזהות את מנהיג הגאולה עוד לפני שהגאולה הושלמה. לפי הביאור בחוברת, משיח מתחיל לפעול בזמן הגלות: הוא כבר מנהיג, מלמד תורה, מחזק מצוות ונלחם על האפשרות של ישראל לחיות על פי התורה."],
["למה זה אמור לעניין אותי?","כי האמונה במשיח אינה נושא צדדי. היא נכנסת לתפילה, לברכת המזון, לציפייה היומיומית ולשאלה „ציפית לישועה?”. אם אנחנו באמת חיים בדור הגאולה, השאלה היא לא רק „מי המשיח?”, אלא גם „מה אני עושה כדי שהגאולה תהיה מציאות בחיים שלי ובסביבה שלי?”"]
];

["Что вообще должен сделать Мошиах?","По Рамбаму, Мошиах восстанавливает царство Давида, приводит Израиль к полноте Торы и мицвот, строит Храм, собирает изгнанников и ведёт мир к признанию Творца. Поэтому признаки — не случайный набор качеств, а проверка соответствия этой задаче."],
["Почему Мошиаха можно распознать ещё в изгнании?","Рамбам вводит стадию «в презумпции, что он Мошиах». Она нужна именно для того, чтобы распознать руководителя Избавления до завершения самого Избавления. Он начинает действовать ещё в изгнании: руководит, учит Торе, укрепляет мицвот и борется за возможность Израиля жить по Торе."],
["Почему это касается меня лично?","Ожидание Мошиаха — не факультативная тема. Оно входит в молитву и в саму еврейскую жизнь. Если поколение действительно стоит у порога Избавления, вопрос становится практическим: что я делаю, чтобы Тора, мицвот и подготовка к Избавлению стали частью моей жизни?"]
];

DATA.he.acceptText=`היות וכל אחד ואחת מאיתנו רוצה להביא את הגאולה הקרובה —
הננו עושים כמעשה זקני ישראל בעת הכתרתו של דוד כמלך ישראל, שקיבלו על עצמם להתמסר ולהתבטל להוראותיו ולמלכותו, ובכך נתנו משנה תוקף למעמדו כמלך ישראל.

ואף עתה, מתוך הכרה בחשיבות קבלת מלכותו של מלך המשיח, על מנת לסייע ולאפשר לו למלא את שליחותו ולגאול את כל בני ישראל מהגלות, הננו מצהירים בזאת.

בקטע הבא צריך לכוון בפירוש כל מילה:

אל כבוד קדושת אדוננו מורנו ורבינו מלך המשיח, הרבי שליט״א
מנחם מענדל שניאורסון מליובאוויטש שיחי׳ לעולם ועד:

הריני מקבל על עצמי את מלכותך ברצון ובשמחה, ומקבל על עצמי להתמסר לקיום רצונך והוראותיך, ולכונן את מלכות ה׳ בעולם בבניית המקדש ובהשבת מלכות ישראל על מכונה.

ויהי רצון שהתמסרות זו תזרז את התגלותך לעין כל, ונזכה לגאולה האמיתית והשלימה במהרה בימינו ממש.

הכרז בכוונה:
יחי אדונינו מורינו ורבינו מלך המשיח לעולם ועד.`;
DATA.he.acceptExplain="הנוסח שלפניכם מבוסס על טופס קבלת המלכות המקורי. הרעיון הוא שקבלת המלכות איננה רק חתימה או סיסמה, אלא החלטה מודעת לקבל את מלכותו של מלך המשיח, להתקשר אליו ולקיים את הוראותיו.";

DATA.ru.acceptTitle="ПРИНЯТИЕ ЦАРСКОЙ ВЛАСТИ";
DATA.ru.acceptText=`Поскольку каждый из нас хочет приблизить скорое Избавление, мы поступаем по примеру старейшин Израиля во время воцарения Давида: они приняли на себя его руководство, подчинились его указаниям и тем самым придали дополнительную силу его царскому статусу.

И сегодня, понимая важность принятия царской власти Короля Мошиаха, чтобы содействовать исполнению его миссии и избавлению всего народа Израиля от изгнания, мы заявляем следующее.

Следующий текст следует произнести осознанно, вдумываясь в каждое слово:

Его Святейшеству, нашему господину, учителю и Ребе, Королю Мошиаху —
Менахему Менделу Шнеерсону из Любавичей, да живёт он во веки веков:

Я с желанием и радостью принимаю на себя твою царскую власть и принимаю решение посвятить себя исполнению твоей воли и указаний, утверждению Царства Всевышнего в мире, строительству Храма и восстановлению царства Израиля.

Да будет воля Всевышнего, чтобы эта преданность ускорила твоё открытое раскрытие перед всеми, и чтобы мы удостоились истинного и полного Избавления немедленно, в наши дни.

Провозгласи осознанно:
Да здравствует наш господин, учитель и Ребе — Король Мошиах — во веки веков.`;
DATA.ru.acceptExplain="Этот текст основан на оригинальном бланке принятия царской власти. Его смысл — не техническая подпись и не лозунг, а осознанное принятие царства, связь с Королём Мошиахом и готовность исполнять его указания.";

DATA.he.certain=[
["01","אם עשה והצליח","עשה והצליח — כולל ניצחון על ההתנגדות","הרמב״ם עובר כאן מתיאור של פעילות לתוצאה: לא רק שהוא פועל לחיזוק התורה ונלחם מלחמות ה׳, אלא שפעולותיו מצליחות בפועל. בנוסח המלא נכלל גם „וניצח כל האומות שסביביו”. בשיחות הרבי מודגש שהעולם עצמו נעשה מוכן יותר לגאולה: ירידת עימות בין מעצמות, פירוק נשק והפניית משאבים לטובת בני אדם — התחלה של „וכתתו חרבותם לאתים”."],
["02","ובנה מקדש במקומו","בנה מקדש במקומו","זהו סימן מרכזי של משיח ודאי. בקונטרס „בית רבינו שבבבל” מוסבר שבזמן הגלות יש מקום מיוחד לבית נשיא הדור — מקום תורה, תפילה ונשיאות — ובדורנו מודגש 770, „בית משיח”, כהכנה והתגלות ראשונית הקשורה לבית המקדש השלישי. הפירוש אינו מחליף את בניין המקדש בירושלים, אלא מסביר את משמעות „במקומו” בתוך תהליך הגאולה."],
["03","וקיבץ נדחי ישראל","קיבוץ נדחי ישראל","משיח מביא בפועל את עם ישראל ממצב של פיזור למצב של קיבוץ. פעילות הרבי למען יהודי ברית המועצות, יציאתם, העלייה לארץ והדרישה להכין עבורם קליטה גשמית ורוחנית מוצגות כהכנה ממשית לקיבוץ הגלויות השלם. כאשר שלושת שלבי ההצלחה מתממשים במלואם, הרמב״ם מגדיר: „הרי זה משיח בוודאי”."]
];
DATA.ru.certain=[
["01","אם עשה והצליח","Сделал и преуспел — включая преодоление сопротивления","Здесь Рамбам переходит от деятельности к результату. В полном тексте говорится и о победе над окружающими народами. В беседах Ребе международные процессы мира, разоружения и перенаправления ресурсов на благо людей объясняются как начало движения мира к пророческому состоянию «перекуют мечи на орала»."],
["02","ובנה מקדש במקומו","Построил Храм «на своём месте»","Это один из центральных критериев стадии «Мошиах несомненно». В кунтресе «Бейт Рабейну ше-бе-Бавель» объясняется особая роль дома главы поколения во время изгнания; в нашем поколении 770 — «Бейт Мошиах» — рассматривается как подготовка и начало раскрытия, связанного с Третьим Храмом. Это не отменяет буквального строительства Храма в Иерусалиме."],
["03","וקיבץ נדחי ישראל","Собрал рассеянных Израиля","Мошиах фактически выводит еврейский народ из состояния рассеяния. Деятельность Ребе ради евреев СССР, их выхода, алии и подготовки духовной и материальной абсорбции рассматривается как реальная подготовка к полному собиранию изгнанников. Когда эти результаты достигают полноты, Рамбам определяет: «это Мошиах несомненно»."]
];

DATA.he.life=[
["התורה קובעת — לא רק מה שנראה לעיניים","יש מצבים שבהם המציאות החיצונית נראית ברורה, אבל התורה דורשת מהאדם לבחון אותה לפי אמת עמוקה יותר. בפסוק „לא תסור מן הדבר אשר יגידו לך ימין ושמאל” מודגשת סמכות התורה וחכמיה. הרעיון איננו להתעלם מן המציאות, אלא להבין שמראה העיניים לבדו אינו תמיד כל התמונה."],
["נשיא הדור הוא „משה שבדור”","בחסידות מוסבר שבכל דור יש נשיא שממלא את תפקיד „משה שבדור” — הראש הרוחני של הדור והצינור שמחבר את נשמות ישראל לעבודת ה׳. בדורות קודמים, כאשר הסתיימה עבודתו של נשיא אחד, ההמשכיות התגלתה בנשיא הבא."],
["מה מיוחד בדור שלנו?","הרבי הגדיר את דורנו כ„הדור האחרון לגלות והדור הראשון לגאולה”. לפי ההסבר בשיחות המאוחרות, אין כאן שליחות שאמורה לעבור לדור נוסף: זהו הדור שצריך להשלים את העבודה ולהיכנס לגאולה עצמה. מכאן נובע הביאור החב״די על נצחיות נשיא דור הגאולה."],
["„חיים נצחיים ללא הפסק בינתיים”","בדבר מלכות בא תשנ״ב ובמקורות נוספים מוסבר החידוש של דור הגאולה, שבו נשיא הדור קשור להמשך הפעולה בעולם הגשמי עד השלמת הגאולה. בחומרי ההסברה החב״דיים מודגש מכאן הביטוי „חיים נצחיים ללא הפסק בינתיים”."],
["מקורות לחיי מלך המשיח","תהילים אומר „חיים שאל ממך נתתה לו, אורך ימים עולם ועד”, ובגמרא סוכה נ״ב ע״א הפסוק נדרש ביחס למשיח בן דוד. הרמב״ן מוסיף שבמשיח עצמו המוות „בטל לגמרי”. בחסידות מוסבר שמשיח קשור לבחינת „יחידה” — עצם החיות — ולכן נושא החיים שלו שייך לנצחיות באופן מיוחד."],
["גילוי, כיסוי והתגלות מחדש","המדרשים מציגים דגם של גואל שנגלה, נכסה וחוזר ונגלה. גם רש״י, רבנו בחיי ומקורות נוספים מובאים בהקשר זה. לכן לפי ההסבר החב״די, תקופה של כיסוי אינה בהכרח סוף השליחות; היא יכולה להיות שלב לפני ההתגלות השלמה."]
];
DATA.ru.life=[
["Тора определяет — не только внешняя картина","Бывают ситуации, когда внешняя картина кажется очевидной, но Тора требует оценивать её через более глубокую истину. Заповедь «не уклоняйся от того, что они скажут тебе, ни вправо, ни влево» подчёркивает авторитет Торы и её мудрецов. Речь не об отрицании реальности, а о том, что видимое глазами не всегда исчерпывает всю картину."],
["Глава поколения — «Моше поколения»","Хасидизм объясняет, что в каждом поколении есть глава, выполняющий функцию «Моше поколения» — духовной головы поколения и канала, связывающего души Израиля со служением Всевышнему. В прежних поколениях, когда работа одного главы завершалась, продолжение раскрывалось в следующем главе."],
["Что особенного в нашем поколении?","Ребе определял наше поколение как «последнее поколение изгнания и первое поколение Избавления». В поздних беседах подчёркивается, что задача не должна переходить к новому поколению: именно это поколение должно завершить работу и войти в Избавление."],
["«Вечная жизнь без промежуточного перерыва»","На основании Двар Малхут Бо 5752 и других источников в хабадской литературе подчёркивается особая непрерывность главы поколения Избавления и используется выражение «вечная жизнь без промежуточного перерыва»."],
["Источники о жизни Короля Мошиаха","В Псалмах сказано: «Жизнь просил у Тебя — Ты дал ему, долготу дней во веки веков»; в Сукка 52а этот стих связывается с Мошиахом бен Давид. Рамбан пишет, что в самом Мошиахе смерть «отменена полностью». Хасидизм связывает Мошиаха с уровнем йехида — сущностью жизненности."],
["Раскрытие, сокрытие и новое раскрытие","Мидраши дают модель избавителя, который раскрывается, скрывается и раскрывается вновь. Раши, Рабейну Бахья и другие источники также приводятся в этом контексте. Поэтому в хабадском объяснении период сокрытия не обязательно означает конец миссии; он может быть этапом перед полным раскрытием."]
];

DATA.he.prophet=[
["מהי נבואה לפי הרמב״ם?","הרמב״ם מונה את הנבואה מיסודי הדת. נביא אמת איננו אדם שנותן תחזיות פרטיות מתוך תחושה; התורה מגדירה תנאים, בדיקה וחובה לשמוע לדבריו כאשר הוא מדבר במסגרת סמכות הנבואה."],
["„אליו תשמעון” — למה זה מחייב?","התורה אומרת על נביא אמת: „אליו תשמעון”. לכן לאחר שנביא הוחזק כנביא על פי כללי התורה, יש לדברים שלו משמעות מעשית. זו נקודה חשובה להבנת היחס החב״די לדברי הרבי על דור הגאולה."],
["חזרת הנבואה לפני הגאולה","באגרת תימן הרמב״ם מביא מסורת על חזרת הנבואה לישראל לפני הגאולה. בחסידות מוסבר שהתקרבות הגאולה מלווה בגילויים רוחניים הולכים ומתחזקים, ולכן נושא הנבואה איננו זר לדיון על משיח."],
["שיחת שופטים תנש״א","בשיחת שופטים תנש״א הרבי מדבר על כך שהקב״ה בחר ומינה אדם שהוא „שופטייך”, „יועצייך” ו„נביא הדור”, ושהוא נותן הוראות ועצות בעבודת ה׳ ובחיי היום־יום. השיחה ממשיכה לבשורת הגאולה — „לאלתר לגאולה” ו„הנה זה משיח בא”."],
["מה זה משנה למעשה?","לפי ההסבר החב״די, אם נשיא הדור הוא גם נביא הדור, אז דבריו על הגאולה אינם רק אמירה מעודדת. הם דורשים תגובה: ללמוד, להתכונן, להוסיף בתורה ובמצוות ולפעול לקבלת פני משיח."]
];
DATA.ru.prophet=[
["Что такое пророчество по Рамбаму?","Рамбам относит пророчество к основам религии. Истинный пророк — не человек, который просто делится личными предчувствиями: Тора определяет критерии, проверку и обязанность слушать его в рамках полномочий пророчества."],
["«Его слушайте» — почему это обязывает?","Тора говорит об истинном пророке: «его слушайте». Поэтому после того, как пророк признан согласно правилам Торы, его слова имеют практическое значение. Это важно для понимания хабадского отношения к словам Ребе о поколении Избавления."],
["Возвращение пророчества перед Избавлением","В «Послании в Йемен» Рамбам приводит традицию о возвращении пророчества к Израилю перед Избавлением. Хасидизм объясняет, что приближение Избавления сопровождается усилением духовного раскрытия."],
["Беседа Шофтим 5751","В беседе Шофтим 5751 Ребе говорит, что Всевышний избрал и назначил человека как «судью», «советника» и «пророка поколения», который даёт указания в служении Всевышнему и в повседневной жизни. Далее звучит весть об Избавлении — «немедленно к Избавлению» и «Вот Мошиах приходит»."],
["Что это меняет на практике?","Согласно хабадскому объяснению, если глава поколения является также пророком поколения, его слова об Избавлении — не просто вдохновляющая фраза. Они требуют практического ответа: изучать, готовиться, прибавлять в Торе и мицвот и действовать ради встречи Мошиаха."]

DATA.he.whyTitle="בחב״ד אומרים שהרבי מלך המשיח שיחי׳ לעולם ועד הוא מלך המשיח — למה?";
DATA.he.whyLeadTitle="לא סיסמה — שאלה הלכתית";
DATA.he.whyLead="הרמב״ם לא משאיר את נושא המשיח בתחום של כריזמה, ניסים או ניחושים. הוא נותן מסלול הלכתי מסודר: מה בכלל אמור מלך המשיח לעשות, מי יכול להיות בחזקת משיח, ומה צריך לקרות כדי להגיע למשיח ודאי. כל אחד מהסימנים בודק האם האדם המסוים הזה מתאים לתפקיד.";

DATA.he.redemptionTitle="לפני הכול: מהי בכלל הגאולה — ולמה שארצה שהיא תגיע?";
DATA.he.redemptionText=`לפעמים אדם שומע „משיח” וחושב מיד: עוד תורה, עוד מצוות, אולי עולם שבו כל מה שאני אוהב ייעלם. אבל תיאור הגאולה בתורה הוא כמעט ההפך מהפחד הזה.

הגאולה האמיתית והשלמה פירושה עולם מתוקן: מלחמות ורדיפות מפסיקות, הרע מאבד את כוחו, מחלות וסבל מתבטלים בשלמות הגאולה, עם ישראל חי בביטחון, והאנושות יכולה להפנות את הכוחות שלה לחיים, לחכמה, לטוב ולהכרת הבורא.

בדבר מלכות אחרי־קדושים תנש״א הרבי מלך המשיח שיחי׳ לעולם ועד מתייחס בדיוק לחשש הזה: יש מי שחושש מביאת המשיח ושואל מה יהיה עם העסקים, הקשרים והתוכניות שבנה. הרבי מלך המשיח שיחי׳ לעולם ועד מסביר שהגאולה אינה מוחקת את הדברים הטובים של העולם. „גאולה” כוללת בתוכה את „גולה” — העולם עצמו נשאר, אבל האל״ף, גילוי אלופו של עולם, חודרת לתוכו. הטוב נשאר ומקבל את משמעותו השלמה; השעבוד, הרע וההסתר הם שמתבטלים.

לכן הגאולה אינה טובה רק לאדם דתי. גם מי שעדיין רחוק מתורה ומצוות יכול לרצות עולם בלי מלחמות, בלי שנאה, בלי פחד ובלי סבל — עולם שבו הטוב שבחיים נשאר, אבל הוא נקי מן הרע שמקלקל אותו.`;

DATA.ru.whyTitle="В Хабаде говорят, что Ребе Король Мошиах, да живёт он во веки веков, — это Король Мошиах. Почему?";
DATA.ru.whyLeadTitle="Не лозунг, а галахический вопрос";
DATA.ru.whyLead="Рамбам не оставляет тему Мошиаха на уровне харизмы, чудес или догадок. Он даёт чёткий путь: что вообще должен сделать Король Мошиах, кто может считаться предполагаемым Мошиахом и что должно произойти, чтобы перейти к статусу Мошиаха несомненно. Каждый критерий проверяет, соответствует ли конкретный человек этой задаче.";
DATA.ru.redemptionTitle="Сначала главное: что такое Избавление — и почему я должен его хотеть?";
DATA.ru.redemptionText=`Иногда слово «Мошиах» воспринимается как обещание мира, в котором исчезнет привычная жизнь и останутся только религиозные обязанности. Но Тора описывает Избавление совсем иначе.

Истинное и полное Избавление — это исправленный мир: войны и преследования прекращаются, зло теряет власть, страдания и болезни исчезают в полноте Избавления, еврейский народ живёт в безопасности, а силы человечества направляются на жизнь, мудрость, добро и познание Творца.

В Двар Малхут Ахарей–Кдошим 5751 Ребе Король Мошиах, да живёт он во веки веков, отвечает на страх: что будет с бизнесом, связями и планами, которые человек строил? Избавление не уничтожает хорошее. Само слово «геула» включает «гола» — изгнание — с добавлением буквы алеф, раскрывающей Владыку мира. Хорошее остаётся и раскрывает свой настоящий смысл; исчезают зло, порабощение и сокрытие.

Поэтому Избавление нужно не только религиозному человеку. Мир без войн, ненависти, страха и страданий — при сохранении всего настоящего добра жизни — желателен для каждого.`;

DATA.he.whyReader=[
["מה בכלל אמור מלך המשיח לעשות?","לפי הרמב״ם, מלך המשיח צריך להחזיר את מלכות בית דוד, להביא את עם ישראל לשלמות של תורה ומצוות, לבנות את בית המקדש, לקבץ את נדחי ישראל ולהוביל את העולם להכרה בבורא. הסימנים שהרמב״ם נותן אינם רשימת שבחים כללית; כל אחד מהם בודק האם האדם המסוים הזה מתאים לתפקיד, והאם הוא אכן מתקדם במסלול שההלכה מגדירה למלך המשיח."],
["למה אפשר לזהות משיח עוד בזמן הגלות?","הרמב״ם עצמו מגדיר שלב של „בחזקת שהוא משיח”. כלומר, עוד לפני השלמת הגאולה יש קריטריונים שמאפשרים לבחון אדם מסוים: ייחוסו, הנהגתו בתורה ובמצוות, השפעתו על כלל ישראל ומלחמות ה׳. לאחר מכן בא שלב התוצאות — „משיח ודאי”."],
["אז מה האתר הזה מנסה לעשות?","לא לבקש מהקורא להתחיל מסיסמה, אלא לעבור שלב־שלב: קודם להבין מהי הגאולה ומהו תפקיד המשיח, אחר כך לקרוא את לשון הרמב״ם, ואז לבדוק כיצד בחב״ד מסבירים שכל אחד מהסימנים מתקיים ברבי מלך המשיח שיחי׳ לעולם ועד."]
];
DATA.ru.whyReader=[
["Что вообще должен сделать Король Мошиах?","По Рамбаму, Король Мошиах должен восстановить царство Давида, привести Израиль к полноте Торы и заповедей, построить Храм, собрать изгнанников и привести мир к познанию Творца. Критерии Рамбама — не список комплиментов: каждый из них проверяет, подходит ли конкретный человек для этой задачи."],
["Почему Мошиаха можно распознать ещё в изгнании?","Сам Рамбам определяет стадию «в презумпции, что он Мошиах». Ещё до завершения Избавления можно проверить происхождение, руководство, Тору и заповеди, влияние на весь Израиль и «войны Всевышнего». Затем идёт стадия фактических результатов — «Мошиах несомненно»."],
["Что делает этот сайт?","Он не просит начинать с лозунга. Сначала — понять, что такое Избавление и какова задача Мошиаха; затем — прочитать критерии Рамбама; и только после этого — увидеть, как в Хабаде объясняют их исполнение у Ребе Короля Мошиаха, да живёт он во веки веков."]
];

el.add.onclick=()=>{if(!el.consent.checked){alert(lang==='he'?'יש לאשר את נוסח קבלת המלכות':'Подтвердите текст принятия царской власти');return} const a=el.f1.value.trim(),b=el.f2.value.trim();if(!a||!b)return;names.push([a,b]);localStorage.setItem('moshiachNames',JSON.stringify(names));el.f1.value='';el.f2.value='';el.consent.checked=false;renderNames()};
el.copy.onclick=async()=>{try{await navigator.clipboard.writeText(names.map((n,i)=>`${i+1}. ${n[0]} | ${n[1]}`).join('\n'))}catch(e){}};
el.download.onclick=()=>{const csv='\uFEFF'+names.map(n=>n.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='kabbalat-malchut.csv';a.click()};
el.clear.onclick=()=>{if(confirm(lang==='he'?'למחוק את כל השמות?':'Удалить все имена?')){names=[];localStorage.removeItem('moshiachNames');renderNames()}};
render();
</script>
</body></html>
